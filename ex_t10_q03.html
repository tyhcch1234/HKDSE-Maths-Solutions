  <h1>T10 Q03</h1>
  <div class="card q">A trapezium has parallel sides of lengths $8$ cm and $12$ cm, and a height of $5$ cm. Find its area.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f0f8ff"/>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Trapezium</text>
  
  <!-- Trapezium shape -->
  <!-- Top side: 8 cm, Bottom side: 12 cm, Height: 5 cm -->
  <!-- Scale: 1 cm = 20 px -->
  <!-- Top side from (140, 80) to (300, 80) = 160px = 8cm -->
  <!-- Bottom side from (100, 180) to (340, 180) = 240px = 12cm -->
  <!-- Height = 100px = 5cm -->
  
  <polygon points="140,80 300,80 340,180 100,180" fill="#ffd700" stroke="#333" stroke-width="2" opacity="0.8"/>
  
  <!-- Height line (dashed) -->
  <line x1="220" y1="80" x2="220" y2="180" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Right angle marker at height line -->
  <polyline points="220,170 230,170 230,180" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  
  <!-- Labels -->
  <!-- Top side label: 8 cm -->
  <text x="220" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">8 cm</text>
  
  <!-- Bottom side label: 12 cm -->
  <text x="220" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">12 cm</text>
  
  <!-- Height label: 5 cm -->
  <text x="235" y="135" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">5 cm</text>
  
  <!-- Vertex labels -->
  <text x="130" y="75" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#555">A</text>
  <text x="310" y="75" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#555">B</text>
  <text x="350" y="190" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#555">C</text>
  <text x="90" y="190" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#555">D</text>
  
  <!-- Area formula hint -->
  <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666">Area = (8 + 12) × 5 ÷ 2</text>
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666">= 50 cm²</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Area $= \tfrac12(a+b)h = \tfrac12(8+12)\times5 = 50$ cm².</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2024_P2_Q15.html">2024 P2 Q15 ↗</a></div>
</div>
