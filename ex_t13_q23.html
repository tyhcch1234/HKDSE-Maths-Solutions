  <h1>T13 Q23</h1>
  <div class="card q">In triangle $ABC$, $a = 5$, $b = 8$ and $C = 30^\circ$. Find the area of the triangle.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <polygon points="80,250 320,250 260,90" fill="#d6ecff" stroke="#1565c0" stroke-width="3"/>
  <circle cx="80" cy="250" r="4" fill="#1565c0"/>
  <circle cx="320" cy="250" r="4" fill="#1565c0"/>
  <circle cx="260" cy="90" r="4" fill="#1565c0"/>
  <text x="62" y="270" font-family="Arial" font-size="18" fill="#0d47a1" font-weight="bold">A</text>
  <text x="326" y="270" font-family="Arial" font-size="18" fill="#0d47a1" font-weight="bold">B</text>
  <text x="252" y="78" font-family="Arial" font-size="18" fill="#0d47a1" font-weight="bold">C</text>
  <text x="190" y="275" font-family="Arial" font-size="16" fill="#c62828" font-weight="bold">b = 8</text>
  <text x="300" y="165" font-family="Arial" font-size="16" fill="#c62828" font-weight="bold">a = 5</text>
  <path d="M 120 250 A 40 40 0 0 0 115 228" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="128" y="238" font-family="Arial" font-size="15" fill="#2e7d32" font-weight="bold">30°</text>
  <text x="150" y="40" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Triangle ABC</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Area $= \tfrac12 ab\sin C = \tfrac12(5)(8)\sin30° = 10$.</div></div>
