  <h1>T11 Q02</h1>
  <div class="card q">Find the sum of the interior angles of a hexagon.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a3a5c">Hexagon</text>
  <polygon points="200,60 310,110 310,210 200,260 90,210 90,110" fill="#d4e8ff" stroke="#1a6fc4" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="200" cy="60" r="4" fill="#e63946"/>
  <circle cx="310" cy="110" r="4" fill="#e63946"/>
  <circle cx="310" cy="210" r="4" fill="#e63946"/>
  <circle cx="200" cy="260" r="4" fill="#e63946"/>
  <circle cx="90" cy="210" r="4" fill="#e63946"/>
  <circle cx="90" cy="110" r="4" fill="#e63946"/>
  <text x="200" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">A</text>
  <text x="322" y="108" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#333">B</text>
  <text x="322" y="214" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#333">C</text>
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">D</text>
  <text x="78" y="214" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#333">E</text>
  <text x="78" y="108" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#333">F</text>
  <text x="200" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1a3a5c">Sum of interior angles = ?</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Sum $= (6-2)\times180° = 720°$.</div></div>
