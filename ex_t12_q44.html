  <div class="meta">Coordinate Geometry (117) · Sub-Topic: Locus</div>
  <h1>T12 Q44</h1>
  <div class="card q">Find the equation of the locus of a point which moves such that its distance from $(2,3)$ is $5$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#ffffff"/>

  <!-- Coordinate axes -->
  <!-- x-axis -->
  <line x1="30" y1="220" x2="370" y2="220" stroke="#333333" stroke-width="1.5"/>
  <polygon points="370,220 362,216 362,224" fill="#333333"/>
  <text x="375" y="225" font-size="12" fill="#333333" font-family="Arial">x</text>

  <!-- y-axis -->
  <line x1="80" y1="300" x2="80" y2="30" stroke="#333333" stroke-width="1.5"/>
  <polygon points="80,30 76,38 84,38" fill="#333333"/>
  <text x="65" y="25" font-size="12" fill="#333333" font-family="Arial">y</text>

  <!-- Origin label -->
  <text x="65" y="235" font-size="11" fill="#333333" font-family="Arial">O</text>

  <!-- Scale: 1 unit = 20px -->
  <!-- Center (2,3) => x = 80 + 2*20 = 120, y = 220 - 3*20 = 160 -->
  <!-- Radius 5 => 5*20 = 100px -->

  <!-- Locus circle: center (120,160), radius 100 -->
  <circle cx="120" cy="160" r="100" fill="#e8f4fd" stroke="#2196F3" stroke-width="2.5"/>

  <!-- Center point (2,3) -->
  <circle cx="120" cy="160" r="4" fill="#E53935" stroke="#B71C1C" stroke-width="1"/>
  <text x="128" y="155" font-size="12" fill="#B71C1C" font-family="Arial" font-weight="bold">(2, 3)</text>

  <!-- Radius line from center to right edge of circle -->
  <line x1="120" y1="160" x2="220" y2="160" stroke="#E53935" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="155" y="153" font-size="12" fill="#E53935" font-family="Arial" font-weight="bold">5</text>

  <!-- A moving point P on the circle (top-right area) -->
  <!-- Point at angle 45 deg: x = 120 + 100*cos(45) = 120+70.7 = 190.7, y = 160 - 100*sin(45) = 160-70.7 = 89.3 -->
  <circle cx="191" cy="89" r="4" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
  <text x="197" y="84" font-size="12" fill="#2E7D32" font-family="Arial" font-weight="bold">P</text>

  <!-- Dashed line from P to center showing distance -->
  <line x1="191" y1="89" x2="120" y2="160" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Tick marks on axes -->
  <!-- x-axis ticks -->
  <line x1="120" y1="217" x2="120" y2="223" stroke="#333333" stroke-width="1"/>
  <text x="116" y="236" font-size="10" fill="#555555" font-family="Arial">2</text>

  <!-- y-axis ticks -->
  <line x1="77" y1="160" x2="83" y2="160" stroke="#333333" stroke-width="1"/>
  <text x="62" y="164" font-size="10" fill="#555555" font-family="Arial">3</text>

  <!-- Title -->
  <text x="200" y="308" font-size="12" fill="#333333" font-family="Arial" text-anchor="middle">Locus: distance from (2,3) is 5</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Circle: $(x-2)^2+(y-3)^2 = 25$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2026_P2_Q24.html">2026 P2 Q24 ↗</a></div>
</div>
