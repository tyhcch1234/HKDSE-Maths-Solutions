  <div class="meta">Geometry (106) · Sub-Topic: Circle Properties</div>
  <h1>T11 Q25</h1>
  <div class="card q">In the figure, $AB$ is a diameter of the circle and $C$ lies on the circle. If $\angle ABC = 35°$, find $\angle BAC$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect width="400" height="320" fill="#ffffff"/>
  
  <!-- Circle -->
  <circle cx="200" cy="160" r="120" fill="#e8f4fd" stroke="#2c7fb8" stroke-width="2.5"/>
  
  <!-- Diameter AB (horizontal) -->
  <line x1="80" y1="160" x2="320" y2="160" stroke="#d95f02" stroke-width="2.5"/>
  
  <!-- Point C on circle (upper right area) -->
  <!-- Angle at B is 35 degrees, so BC makes 35 deg with BA -->
  <!-- C is on circle, angle ABC = 35 deg -->
  <!-- Using circle: center (200,160), r=120 -->
  <!-- B = (320,160), A = (80,160) -->
  <!-- BC direction: from B, angle 180-35 = 145 deg from positive x-axis -->
  <!-- C on circle: parametrize, C = (200+120cos(t), 160-120sin(t)) -->
  <!-- Angle ABC = 35 deg means angle between BA and BC is 35 deg -->
  <!-- BA direction from B is 180 deg. BC direction is 180-35 = 145 deg -->
  <!-- Line from B(320,160) at 145 deg: slope = tan(145) = -tan(35) ≈ -0.7002 -->
  <!-- y - 160 = -0.7002(x - 320) -->
  <!-- Circle: (x-200)^2 + (y-160)^2 = 14400 -->
  <!-- Substitute: (x-200)^2 + (-0.7002(x-320))^2 = 14400 -->
  <!-- Let u = x-200, then x-320 = u-120 -->
  <!-- u^2 + 0.4903(u-120)^2 = 14400 -->
  <!-- u^2 + 0.4903(u^2 - 240u + 14400) = 14400 -->
  <!-- 1.4903u^2 - 117.67u + 7060.3 = 14400 -->
  <!-- 1.4903u^2 - 117.67u - 7339.7 = 0 -->
  <!-- u = [117.67 ± sqrt(13846 + 43760)] / 2.9806 -->
  <!-- u = [117.67 ± sqrt(57606)] / 2.9806 -->
  <!-- u = [117.67 ± 240.01] / 2.9806 -->
  <!-- u = 357.68/2.9806 = 120.0 or u = -122.34/2.9806 = -41.05 -->
  <!-- u=120 gives x=320 (point B), u=-41.05 gives x=158.95 -->
  <!-- y = 160 - 0.7002(158.95-320) = 160 - 0.7002(-161.05) = 160 + 112.77 = 272.77 -->
  <!-- That's below the circle. Let me reconsider. -->
  <!-- Actually C should be above AB. Let me redo. -->
  <!-- Angle ABC = 35 deg. BA points left (180 deg). BC is 35 deg from BA toward upper side -->
  <!-- So BC direction = 180 - 35 = 145 deg from positive x-axis -->
  <!-- From B(320,160): direction 145 deg means dx = cos(145) < 0, dy = -sin(145) < 0 (upward in SVG) -->
  <!-- Wait, in SVG y increases downward. Let me use standard math coords then flip. -->
  <!-- In math coords: B=(320,160), BA direction = 180 deg. BC at 180-35=145 deg. -->
  <!-- dx = cos(145) = -0.819, dy = sin(145) = 0.574 (upward in math) -->
  <!-- In SVG: dy_svg = -0.574 -->
  <!-- Line: (x,y) = (320 - 0.819t, 160 - 0.574t) -->
  <!-- Circle: (x-200)^2 + (y-160)^2 = 14400 -->
  <!-- (120 - 0.819t)^2 + (-0.574t)^2 = 14400 -->
  <!-- 14400 - 196.56t + 0.6708t^2 + 0.3294t^2 = 14400 -->
  <!-- t^2 - 196.56t = 0 -->
  <!-- t = 196.56 -->
  <!-- x = 320 - 0.819(196.56) = 320 - 160.98 = 159.02 -->
  <!-- y = 160 - 0.574(196.56) = 160 - 112.83 = 47.17 -->
  <!-- So C ≈ (159, 47) -->
  
  <!-- Triangle ABC -->
  <line x1="80" y1="160" x2="159" y2="47" stroke="#1b9e77" stroke-width="2.5"/>
  <line x1="320" y1="160" x2="159" y2="47" stroke="#1b9e77" stroke-width="2.5"/>
  
  <!-- Right angle marker at C (angle in semicircle = 90 deg) -->
  <!-- Vectors from C: CA = (80-159, 160-47) = (-79, 113), CB = (320-159, 160-47) = (161, 113) -->
  <!-- Unit vectors: CA/|CA|, CB/|CB| -->
  <!-- |CA| = sqrt(6241+12769) = sqrt(19010) ≈ 137.9 -->
  <!-- |CB| = sqrt(25921+12769) = sqrt(38690) ≈ 196.7 -->
  <!-- u_CA = (-0.573, 0.819), u_CB = (0.818, 0.574) -->
  <!-- Right angle marker: from C, go 15 units along u_CA and u_CB, then complete square -->
  <!-- P1 = C + 15*u_CA = (159-8.6, 47+12.3) = (150.4, 59.3) -->
  <!-- P2 = C + 15*u_CB = (159+12.3, 47+8.6) = (171.3, 55.6) -->
  <!-- P3 = P1 + 15*u_CB = (150.4+12.3, 59.3+8.6) = (162.7, 67.9) -->
  <polyline points="150.4,59.3 162.7,67.9 171.3,55.6" fill="none" stroke="#7570b3" stroke-width="1.8"/>
  
  <!-- Points -->
  <circle cx="80" cy="160" r="4" fill="#d95f02"/>
  <circle cx="320" cy="160" r="4" fill="#d95f02"/>
  <circle cx="159" cy="47" r="4" fill="#1b9e77"/>
  
  <!-- Labels -->
  <text x="62" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d95f02">A</text>
  <text x="328" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d95f02">B</text>
  <text x="150" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1b9e77">C</text>
  
  <!-- Angle label at B: 35° -->
  <!-- Arc at B from BA to BC -->
  <path d="M 295,160 A 25,25 0 0,0 299.5,145.6" fill="none" stroke="#e7298a" stroke-width="1.8"/>
  <text x="278" y="148" font-family="Arial, sans-serif" font-size="14" fill="#e7298a">35°</text>
  
  <!-- Angle label at A: ? -->
  <text x="100" y="148" font-family="Arial, sans-serif" font-size="14" fill="#e7298a">?</text>
  
  <!-- Right angle label at C -->
  <text x="165" y="72" font-family="Arial, sans-serif" font-size="12" fill="#7570b3">90°</text>
  
  <!-- Title -->
  <text x="200" y="305" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">AB is a diameter, C lies on the circle</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Angle subtended by a diameter $= 90°$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2024_P2_Q18.html">2024 P2 Q18 ↗</a></div>
