  <a class="back" href="DSE_Maths_Exercise.html">← Back to Exercises</a>
  <div class="meta">Mensuration (64) · Sub-Topic: Volume</div>
  <h1>T10 Q22</h1>
  <div class="card q">A pyramid has a base area of $30\text{ cm}^2$ and a height of $9\text{ cm}$. Find its volume.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#2C5F8A"/>
    </linearGradient>
    <linearGradient id="faceGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D4891A"/>
    </linearGradient>
    <linearGradient id="faceGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7C948"/>
      <stop offset="100%" stop-color="#E0A820"/>
    </linearGradient>
    <linearGradient id="faceGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8833A"/>
      <stop offset="100%" stop-color="#C46A28"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Pyramid</text>

  <!-- Base (parallelogram for 3D effect) -->
  <polygon points="100,240 280,240 320,200 140,200" fill="url(#baseGrad)" stroke="#1E4060" stroke-width="1.5"/>

  <!-- Back face (left) -->
  <polygon points="100,240 140,200 200,80" fill="url(#faceGrad3)" stroke="#A05020" stroke-width="1.5" opacity="0.85"/>

  <!-- Front face (right) -->
  <polygon points="280,240 320,200 200,80" fill="url(#faceGrad1)" stroke="#A06010" stroke-width="1.5"/>

  <!-- Front face (left) -->
  <polygon points="100,240 280,240 200,80" fill="url(#faceGrad2)" stroke="#B08020" stroke-width="1.5" opacity="0.9"/>

  <!-- Height line (dashed) from apex to base center -->
  <line x1="200" y1="80" x2="210" y2="220" stroke="#D0021B" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="210" cy="220" r="3" fill="#D0021B"/>

  <!-- Right angle marker at base -->
  <polyline points="210,210 220,210 220,220" fill="none" stroke="#D0021B" stroke-width="1.5"/>

  <!-- Height label -->
  <text x="225" y="155" font-family="Arial, sans-serif" font-size="13" fill="#D0021B" font-weight="bold">h = 9 cm</text>

  <!-- Base area label -->
  <text x="200" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1E4060" font-weight="bold">Base area = 30 cm²</text>

  <!-- Apex dot -->
  <circle cx="200" cy="80" r="4" fill="#333"/>

  <!-- Volume formula box -->
  <rect x="90" y="285" width="220" height="28" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="200" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2C5F8A" font-weight="bold">V = (1/3) × base area × height</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Volume $= \tfrac13\times30\times9 = 90$ cm³.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2025_P1_Q14.html">2025 P1 Q14 ↗</a></div>
</div>
