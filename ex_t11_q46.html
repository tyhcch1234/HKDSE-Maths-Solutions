  <h1>T11 Q46</h1>
  <div class="card q">How many edges does a tetrahedron have?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a3a6b">Tetrahedron</text>
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">How many edges does it have?</text>

  <!-- Back edge (hidden) -->
  <line x1="200" y1="90" x2="120" y2="230" stroke="#9bb8e0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Front face triangle -->
  <polygon points="200,90 120,230 280,230" fill="#d6e8ff" stroke="#2b6cb0" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left face -->
  <polygon points="200,90 120,230 160,270" fill="#a8d5ff" stroke="#2b6cb0" stroke-width="2.5" stroke-linejoin="round" opacity="0.85"/>

  <!-- Right face -->
  <polygon points="200,90 280,230 160,270" fill="#7fc4ff" stroke="#2b6cb0" stroke-width="2.5" stroke-linejoin="round" opacity="0.85"/>

  <!-- Base triangle (bottom) -->
  <polygon points="120,230 280,230 160,270" fill="#5ba8e8" stroke="#2b6cb0" stroke-width="2.5" stroke-linejoin="round" opacity="0.7"/>

  <!-- Vertices -->
  <circle cx="200" cy="90" r="5" fill="#e53e3e"/>
  <circle cx="120" cy="230" r="5" fill="#e53e3e"/>
  <circle cx="280" cy="230" r="5" fill="#e53e3e"/>
  <circle cx="160" cy="270" r="5" fill="#e53e3e"/>

  <!-- Vertex labels -->
  <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a3a6b">A</text>
  <text x="108" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a3a6b">B</text>
  <text x="292" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a3a6b">C</text>
  <text x="160" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a3a6b">D</text>

  <!-- Edge count annotation -->
  <text x="200" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2b6cb0">4 vertices, 4 faces, ? edges</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>A tetrahedron has 6 edges.</div></div>
