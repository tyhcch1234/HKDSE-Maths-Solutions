  <a class="back" href="DSE_Maths_Exercise.html">← Back to Exercises</a>
  <div class="meta">Coordinate Geometry (117) · Sub-Topic: Equation of Straight Line</div>
  <h1>T12 Q24</h1>
  <div class="card q">Find the equation of the straight line with slope $3$ and $y$-intercept $-2$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#ffffff"/>
  
  <!-- Grid lines (light) -->
  <g stroke="#e8e8e8" stroke-width="1">
    <line x1="50" y1="40" x2="50" y2="280"/>
    <line x1="100" y1="40" x2="100" y2="280"/>
    <line x1="150" y1="40" x2="150" y2="280"/>
    <line x1="200" y1="40" x2="200" y2="280"/>
    <line x1="250" y1="40" x2="250" y2="280"/>
    <line x1="300" y1="40" x2="300" y2="280"/>
    <line x1="350" y1="40" x2="350" y2="280"/>
    <line x1="50" y1="40" x2="350" y2="40"/>
    <line x1="50" y1="80" x2="350" y2="80"/>
    <line x1="50" y1="120" x2="350" y2="120"/>
    <line x1="50" y1="160" x2="350" y2="160"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="50" y1="240" x2="350" y2="240"/>
    <line x1="50" y1="280" x2="350" y2="280"/>
  </g>
  
  <!-- Axes -->
  <line x1="50" y1="240" x2="360" y2="240" stroke="#333333" stroke-width="2"/>
  <line x1="200" y1="280" x2="200" y2="30" stroke="#333333" stroke-width="2"/>
  
  <!-- Axis arrows -->
  <polygon points="360,240 350,236 350,244" fill="#333333"/>
  <polygon points="200,30 196,40 204,40" fill="#333333"/>
  
  <!-- Axis labels -->
  <text x="365" y="245" font-family="Arial" font-size="14" fill="#333333">x</text>
  <text x="205" y="28" font-family="Arial" font-size="14" fill="#333333">y</text>
  <text x="185" y="255" font-family="Arial" font-size="12" fill="#333333">O</text>
  
  <!-- The line: y = 3x - 2 -->
  <!-- Scale: 1 unit = 20px. Origin at (200, 240) -->
  <!-- y-intercept at (0, -2) => pixel (200, 240+40) = (200, 280) -->
  <!-- x-intercept at (2/3, 0) => pixel (200+13.3, 240) -->
  <!-- Another point: x=1, y=1 => (220, 220) -->
  <!-- x=2, y=4 => (240, 160) -->
  <!-- x=-1, y=-5 => (180, 340) off screen -->
  <!-- Draw from x=-0.5 (y=-3.5 => 190, 310) to x=2.5 (y=5.5 => 250, 130) -->
  <line x1="190" y1="310" x2="250" y2="130" stroke="#e63946" stroke-width="3"/>
  
  <!-- y-intercept point -->
  <circle cx="200" cy="280" r="5" fill="#e63946"/>
  <text x="210" y="295" font-family="Arial" font-size="13" fill="#e63946">(0, -2)</text>
  
  <!-- Slope triangle to show slope = 3 -->
  <!-- From (0,-2) to (1,1): run=1, rise=3 -->
  <line x1="200" y1="280" x2="220" y2="280" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="220" y1="280" x2="220" y2="220" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="205" y="275" font-family="Arial" font-size="11" fill="#2a9d8f">1</text>
  <text x="225" y="255" font-family="Arial" font-size="11" fill="#2a9d8f">3</text>
  
  <!-- Point (1,1) -->
  <circle cx="220" cy="220" r="4" fill="#2a9d8f"/>
  
  <!-- Slope label -->
  <text x="270" y="180" font-family="Arial" font-size="14" fill="#e63946" font-weight="bold">slope = 3</text>
  <text x="270" y="200" font-family="Arial" font-size="14" fill="#e63946" font-weight="bold">y-intercept = -2</text>
  
  <!-- Equation box -->
  <rect x="255" y="55" width="130" height="40" rx="6" fill="#fff3cd" stroke="#e63946" stroke-width="2"/>
  <text x="270" y="80" font-family="Arial" font-size="15" fill="#333333" font-weight="bold">y = 3x - 2</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$y = 3x-2$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2021_P2_Q23.html">2021 P2 Q23 ↗</a></div>
</div>
