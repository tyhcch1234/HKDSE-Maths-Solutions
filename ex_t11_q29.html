  <div class="meta">Geometry (106) · Sub-Topic: Circle Properties</div>
  <h1>T11 Q29</h1>
  <div class="card q">In a circle, two chords of equal length are drawn. What can be concluded about their distances from the centre of the circle?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="100%" stop-color="#e6f0fa"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Equal Chords in a Circle</text>

  <!-- Circle -->
  <circle cx="200" cy="175" r="110" fill="#d6eaf8" stroke="#2980b9" stroke-width="2.5" opacity="0.85"/>

  <!-- Centre point O -->
  <circle cx="200" cy="175" r="4" fill="#e74c3c"/>
  <text x="210" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">O</text>

  <!-- Chord AB (top, horizontal) -->
  <line x1="120" y1="100" x2="280" y2="100" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
  <text x="112" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">A</text>
  <text x="284" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">B</text>

  <!-- Chord CD (bottom, horizontal, equal length) -->
  <line x1="120" y1="250" x2="280" y2="250" stroke="#8e44ad" stroke-width="3" stroke-linecap="round"/>
  <text x="112" y="258" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#8e44ad">C</text>
  <text x="284" y="258" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#8e44ad">D</text>

  <!-- Perpendicular from O to AB (distance d1) -->
  <line x1="200" y1="175" x2="200" y2="100" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="193" y="100" width="14" height="14" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <text x="208" y="140" font-family="Arial, sans-serif" font-size="12" fill="#e67e22" font-weight="bold">d</text>

  <!-- Perpendicular from O to CD (distance d2) -->
  <line x1="200" y1="175" x2="200" y2="250" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="193" y="236" width="14" height="14" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <text x="208" y="215" font-family="Arial, sans-serif" font-size="12" fill="#e67e22" font-weight="bold">d</text>

  <!-- Equal length markers on chords -->
  <line x1="185" y1="95" x2="185" y2="105" stroke="#27ae60" stroke-width="2"/>
  <line x1="215" y1="95" x2="215" y2="105" stroke="#27ae60" stroke-width="2"/>
  <line x1="185" y1="245" x2="185" y2="255" stroke="#8e44ad" stroke-width="2"/>
  <line x1="215" y1="245" x2="215" y2="255" stroke="#8e44ad" stroke-width="2"/>

  <!-- Conclusion box -->
  <rect x="60" y="290" width="280" height="24" rx="6" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5"/>
  <text x="200" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7d6608" font-weight="bold">Equal chords are equidistant from the centre</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Equal chords are equidistant from the centre.</div></div>
