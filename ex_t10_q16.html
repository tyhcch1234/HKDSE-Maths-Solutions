  <h1>T10 Q16</h1>
  <div class="card q">A rectangular box has dimensions $4$ cm, $5$ cm and $6$ cm. Find its volume.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Rectangular Box</text>

  <!-- Front face -->
  <rect x="70" y="120" width="180" height="120" fill="#8ecae6" stroke="#1f3a5f" stroke-width="2"/>
  <!-- Top face -->
  <polygon points="70,120 130,70 310,70 250,120" fill="#a7d8f0" stroke="#1f3a5f" stroke-width="2"/>
  <!-- Right face -->
  <polygon points="250,120 310,70 310,190 250,240" fill="#6fb6d6" stroke="#1f3a5f" stroke-width="2"/>

  <!-- Dimension labels -->
  <!-- Length 6 cm along front bottom -->
  <text x="160" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f3a5f">6 cm</text>
  <line x1="70" y1="248" x2="250" y2="248" stroke="#1f3a5f" stroke-width="1.5"/>
  <line x1="70" y1="243" x2="70" y2="253" stroke="#1f3a5f" stroke-width="1.5"/>
  <line x1="250" y1="243" x2="250" y2="253" stroke="#1f3a5f" stroke-width="1.5"/>

  <!-- Height 4 cm along front left -->
  <text x="38" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f3a5f" transform="rotate(-90 38 185)">4 cm</text>
  <line x1="55" y1="120" x2="55" y2="240" stroke="#1f3a5f" stroke-width="1.5"/>
  <line x1="50" y1="120" x2="60" y2="120" stroke="#1f3a5f" stroke-width="1.5"/>
  <line x1="50" y1="240" x2="60" y2="240" stroke="#1f3a5f" stroke-width="1.5"/>

  <!-- Depth 5 cm along top right edge -->
  <text x="300" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f3a5f">5 cm</text>
  <line x1="130" y1="58" x2="310" y2="58" stroke="#1f3a5f" stroke-width="1.5"/>
  <line x1="130" y1="53" x2="130" y2="63" stroke="#1f3a5f" stroke-width="1.5"/>
  <line x1="310" y1="53" x2="310" y2="63" stroke="#1f3a5f" stroke-width="1.5"/>

  <!-- Volume formula hint -->
  <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#2a6f97">Volume = 4 × 5 × 6 = 120 cm³</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Volume $= 4\times5\times6 = 120$ cm³.</div></div>
