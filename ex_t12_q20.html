  <h1>T12 Q20</h1>
  <div class="card q">Find the \(x\)-intercept of the straight line \(2x-6=0\).</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <!-- axes -->
  <line x1="40" y1="160" x2="370" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="20" x2="200" y2="300" stroke="#333" stroke-width="2"/>
  <polygon points="370,160 360,155 360,165" fill="#333"/>
  <polygon points="200,20 195,30 205,30" fill="#333"/>
  <text x="375" y="165" font-size="14" fill="#333">x</text>
  <text x="205" y="18" font-size="14" fill="#333">y</text>
  <text x="185" y="175" font-size="14" fill="#333">O</text>
  <!-- vertical line x = 3 -->
  <line x1="290" y1="30" x2="290" y2="290" stroke="#e63946" stroke-width="3"/>
  <text x="296" y="45" font-size="14" fill="#e63946">x = 3</text>
  <!-- x-intercept point -->
  <circle cx="290" cy="160" r="5" fill="#e63946"/>
  <text x="270" y="185" font-size="14" fill="#e63946">(3, 0)</text>
  <!-- tick marks -->
  <line x1="290" y1="155" x2="290" y2="165" stroke="#333" stroke-width="2"/>
  <text x="285" y="180" font-size="12" fill="#333">3</text>
  <!-- equation label -->
  <text x="60" y="60" font-size="16" fill="#1d3557">2x - 6 = 0</text>
  <text x="60" y="85" font-size="14" fill="#457b9d">x-intercept: x = 3</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Set $y=0$: $2x-6=0 \Rightarrow x=3$.</div></div>
