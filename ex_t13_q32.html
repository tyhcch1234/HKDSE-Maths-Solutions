  <h1>T13 Q32</h1>
  <div class="card q">Simplify $\frac{\sin^2\theta}{1-\cos^2\theta}$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a3a6b">Trigonometric Identity</text>
  <rect x="40" y="55" width="320" height="70" rx="10" fill="#e8f0fe" stroke="#4a90d9" stroke-width="2"/>
  <text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1a3a6b">Simplify:</text>
  <text x="200" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#c0392b">sin²θ / (1 − cos²θ)</text>
  <rect x="40" y="145" width="320" height="60" rx="10" fill="#fef9e7" stroke="#f1c40f" stroke-width="2"/>
  <text x="200" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7d6608">Recall identity:</text>
  <text x="200" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7d6608">sin²θ + cos²θ = 1</text>
  <rect x="40" y="225" width="320" height="60" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e6b3a">So 1 − cos²θ = sin²θ</text>
  <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e6b3a">Answer: sin²θ / sin²θ = 1</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$\tfrac{\sin^2\theta}{1-\cos^2\theta} = \tfrac{\sin^2\theta}{\sin^2\theta} = 1$.</div></div>
