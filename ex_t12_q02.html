  <h1>T12 Q02</h1>
  <div class="card q">Find the slope of the line passing through the points $(2, 3)$ and $(5, 9)$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect x="0" y="0" width="400" height="320" fill="#f8fbff"/>
  <!-- axes -->
  <line x1="50" y1="270" x2="370" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="270" x2="50" y2="30" stroke="#333" stroke-width="2"/>
  <polygon points="370,270 360,265 360,275" fill="#333"/>
  <polygon points="50,30 45,40 55,40" fill="#333"/>
  <text x="375" y="275" font-size="14" fill="#333">x</text>
  <text x="40" y="25" font-size="14" fill="#333">y</text>
  <!-- grid ticks -->
  <g stroke="#c9d6e3" stroke-width="1">
    <line x1="90" y1="270" x2="90" y2="275"/>
    <line x1="130" y1="270" x2="130" y2="275"/>
    <line x1="170" y1="270" x2="170" y2="275"/>
    <line x1="210" y1="270" x2="210" y2="275"/>
    <line x1="250" y1="270" x2="250" y2="275"/>
    <line x1="290" y1="270" x2="290" y2="275"/>
    <line x1="330" y1="270" x2="330" y2="275"/>
    <line x1="45" y1="230" x2="50" y2="230"/>
    <line x1="45" y1="190" x2="50" y2="190"/>
    <line x1="45" y1="150" x2="50" y2="150"/>
    <line x1="45" y1="110" x2="50" y2="110"/>
    <line x1="45" y1="70" x2="50" y2="70"/>
  </g>
  <!-- scale: 1 unit = 40px, origin at (50,270) -->
  <!-- P(2,3) -> (130,150) ; Q(5,9) -> (250, -90)?? too high. Use 1 unit=25px vertical? Let's use 1 unit=25px both: P(2,3)->(100,195), Q(5,9)->(175,45) -->
  <!-- recompute with 1 unit = 30px: origin (50,270): P(2,3)->(110,180), Q(5,9)->(200,0) too high. Use 1 unit=25px: P(2,3)->(100,195), Q(5,9)->(175,45) -->
  <!-- line through P and Q -->
  <line x1="60" y1="220" x2="230" y2="10" stroke="#e63946" stroke-width="3"/>
  <!-- right triangle guide -->
  <line x1="100" y1="195" x2="175" y2="195" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="175" y1="195" x2="175" y2="45" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- points -->
  <circle cx="100" cy="195" r="5" fill="#1d3557"/>
  <circle cx="175" cy="45" r="5" fill="#1d3557"/>
  <!-- labels -->
  <text x="78" y="215" font-size="14" fill="#1d3557" font-weight="bold">(2, 3)</text>
  <text x="182" y="40" font-size="14" fill="#1d3557" font-weight="bold">(5, 9)</text>
  <!-- run and rise labels -->
  <text x="125" y="213" font-size="13" fill="#2a9d8f" font-weight="bold">run = 3</text>
  <text x="182" y="125" font-size="13" fill="#2a9d8f" font-weight="bold">rise = 6</text>
  <!-- slope note -->
  <text x="240" y="120" font-size="14" fill="#e63946" font-weight="bold">slope = 6/3 = 2</text>

<h2>Solution</h2>
  <div class="card sol"><div class='step'>$m = \tfrac{9-3}{5-2} = \tfrac{6}{3} = 2$.</div></div>
