  <div class="meta">Geometry (106) · Sub-Topic: Angles in Triangles/Polygons</div>
  <h1>T11 Q13</h1>
  <div class="card q">The size of each exterior angle of a regular polygon is $30°$. Find the number of sides of the polygon.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a3a6b">Regular Polygon</text>
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Each exterior angle = 30°</text>

  <!-- Regular dodecagon (12 sides) centered at (200,175) radius 110 -->
  <g stroke="#1a6b3a" stroke-width="2.5" fill="#d4f5e0" stroke-linejoin="round">
    <polygon points="310,175 303.1,216.2 283.1,252.8 252.8,283.1 216.2,303.1 175,310 133.8,303.1 97.2,283.1 66.9,252.8 46.9,216.2 40,175 46.9,133.8 66.9,97.2 97.2,66.9 133.8,46.9 175,40 216.2,46.9 252.8,66.9 283.1,97.2 303.1,133.8" />
  </g>

  <!-- Highlight one exterior angle at top vertex (175,40) -->
  <!-- Extend side from (216.2,46.9) through (175,40) to a point beyond -->
  <line x1="175" y1="40" x2="133.8" y2="33.1" stroke="#d62828" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="175" y1="40" x2="216.2" y2="46.9" stroke="#d62828" stroke-width="2.5"/>
  <!-- Arc for exterior angle -->
  <path d="M 160,42 A 18,18 0 0 0 190,48" fill="none" stroke="#d62828" stroke-width="2"/>
  <text x="148" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d62828">30°</text>

  <!-- Center dot -->
  <circle cx="175" cy="175" r="3" fill="#1a3a6b"/>

  <!-- Info box -->
  <rect x="60" y="270" width="280" height="38" rx="8" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5"/>
  <text x="200" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5a4500">Exterior angle sum = 360°</text>
  <text x="200" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5a4500">Number of sides = 360° ÷ 30°</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$n = 360°/30° = 12$ sides.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2020_P1_Q9.html">2020 P1 Q9 ↗</a></div>
</div>
