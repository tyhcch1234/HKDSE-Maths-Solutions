  <h1>T12 Q45</h1>
  <div class="card q">A point $P(x, y)$ moves such that its distance from the $x$-axis is always 2. Describe the locus of $P$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Grid lines (light) -->
  <g stroke="#dbe7f3" stroke-width="1">
    <line x1="40" y1="40" x2="40" y2="280"/>
    <line x1="80" y1="40" x2="80" y2="280"/>
    <line x1="120" y1="40" x2="120" y2="280"/>
    <line x1="160" y1="40" x2="160" y2="280"/>
    <line x1="200" y1="40" x2="200" y2="280"/>
    <line x1="240" y1="40" x2="240" y2="280"/>
    <line x1="280" y1="40" x2="280" y2="280"/>
    <line x1="320" y1="40" x2="320" y2="280"/>
    <line x1="360" y1="40" x2="360" y2="280"/>
    <line x1="40" y1="40" x2="360" y2="40"/>
    <line x1="40" y1="80" x2="360" y2="80"/>
    <line x1="40" y1="120" x2="360" y2="120"/>
    <line x1="40" y1="160" x2="360" y2="160"/>
    <line x1="40" y1="200" x2="360" y2="200"/>
    <line x1="40" y1="240" x2="360" y2="240"/>
    <line x1="40" y1="280" x2="360" y2="280"/>
  </g>

  <!-- Axes -->
  <line x1="40" y1="160" x2="370" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="290" x2="200" y2="30" stroke="#333" stroke-width="2"/>
  <!-- Arrowheads -->
  <polygon points="370,160 360,155 360,165" fill="#333"/>
  <polygon points="200,30 195,40 205,40" fill="#333"/>

  <!-- Axis labels -->
  <text x="375" y="165" font-family="Arial" font-size="14" fill="#333">x</text>
  <text x="205" y="28" font-family="Arial" font-size="14" fill="#333">y</text>
  <text x="185" y="175" font-family="Arial" font-size="12" fill="#333">O</text>

  <!-- Locus lines: y = 2 and y = -2 -->
  <!-- Scale: 1 unit = 40 px, so y=2 -> 160-80=80, y=-2 -> 160+80=240 -->
  <line x1="40" y1="80" x2="360" y2="80" stroke="#e63946" stroke-width="3" stroke-dasharray="10,5"/>
  <line x1="40" y1="240" x2="360" y2="240" stroke="#e63946" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- Locus labels -->
  <text x="300" y="72" font-family="Arial" font-size="13" fill="#e63946" font-weight="bold">y = 2</text>
  <text x="300" y="258" font-family="Arial" font-size="13" fill="#e63946" font-weight="bold">y = -2</text>

  <!-- Distance markers -->
  <!-- From x-axis to y=2 line -->
  <line x1="120" y1="160" x2="120" y2="80" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="115" y1="160" x2="125" y2="160" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="115" y1="80" x2="125" y2="80" stroke="#2a9d8f" stroke-width="2"/>
  <text x="128" y="125" font-family="Arial" font-size="13" fill="#2a9d8f" font-weight="bold">2</text>

  <!-- From x-axis to y=-2 line -->
  <line x1="280" y1="160" x2="280" y2="240" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="275" y1="160" x2="285" y2="160" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="275" y1="240" x2="285" y2="240" stroke="#2a9d8f" stroke-width="2"/>
  <text x="288" y="205" font-family="Arial" font-size="13" fill="#2a9d8f" font-weight="bold">2</text>

  <!-- Point P on upper line -->
  <circle cx="160" cy="80" r="5" fill="#1d3557"/>
  <text x="168" y="72" font-family="Arial" font-size="14" fill="#1d3557" font-weight="bold">P(x, y)</text>

  <!-- Title -->
  <text x="200" y="310" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">Locus of P: distance from x-axis is always 2</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Horizontal line $y=2$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2025_P1_Q4.html">2025 P1 Q4 ↗</a></div>
