  <h1>T10 Q48</h1>
  <div class="card q">Two similar solid cones have surface areas in the ratio \(4:9\). Find the ratio of their heights.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="smallCone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#7EC8E3"/>
    </linearGradient>
    <linearGradient id="largeCone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8836B"/>
      <stop offset="100%" stop-color="#F5B895"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Two Similar Solid Cones</text>

  <!-- Small cone (left) -->
  <!-- Base ellipse -->
  <ellipse cx="110" cy="240" rx="55" ry="14" fill="#4A90D9" opacity="0.35" stroke="#2C6BA0" stroke-width="1.5"/>
  <!-- Cone body -->
  <path d="M 55 240 L 110 100 L 165 240" fill="url(#smallCone)" stroke="#2C6BA0" stroke-width="1.5" opacity="0.85"/>
  <!-- Height line -->
  <line x1="110" y1="100" x2="110" y2="240" stroke="#2C6BA0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Right angle mark -->
  <polyline points="110,232 118,232 118,240" fill="none" stroke="#2C6BA0" stroke-width="1.2"/>
  <!-- Height label -->
  <text x="118" y="175" font-family="Arial, sans-serif" font-size="12" fill="#2C6BA0" font-style="italic">h₁</text>

  <!-- Large cone (right) -->
  <!-- Base ellipse -->
  <ellipse cx="290" cy="260" rx="80" ry="20" fill="#E8836B" opacity="0.35" stroke="#B85A3E" stroke-width="1.5"/>
  <!-- Cone body -->
  <path d="M 210 260 L 290 80 L 370 260" fill="url(#largeCone)" stroke="#B85A3E" stroke-width="1.5" opacity="0.85"/>
  <!-- Height line -->
  <line x1="290" y1="80" x2="290" y2="260" stroke="#B85A3E" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Right angle mark -->
  <polyline points="290,250 300,250 300,260" fill="none" stroke="#B85A3E" stroke-width="1.2"/>
  <!-- Height label -->
  <text x="300" y="175" font-family="Arial, sans-serif" font-size="12" fill="#B85A3E" font-style="italic">h₂</text>

  <!-- Ratio info box -->
  <rect x="100" y="288" width="200" height="24" rx="12" fill="#F0F4F8" stroke="#B0C4DE" stroke-width="1"/>
  <text x="200" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Surface area ratio = 4 : 9</text>

  <!-- Small cone label -->
  <text x="110" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C6BA0">Small cone</text>

  <!-- Large cone label -->
  <text x="290" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#B85A3E">Large cone</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Surface area ratio $= 4:9$, linear ratio $= 2:3$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2018_P2_Q15.html">2018 P2 Q15 ↗</a></div>
