  <h1>T11 Q20</h1>
  <div class="card q">In a cyclic quadrilateral $ABCD$, $\angle A = 85^\circ$. Find $\angle C$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <circle cx="200" cy="160" r="120" fill="#e8f4ff" stroke="#2a6fb0" stroke-width="3"/>
  <polygon points="200,40 320,160 200,280 80,160" fill="#fff3d6" stroke="#d48a00" stroke-width="2.5" opacity="0.85"/>
  <circle cx="200" cy="40" r="4" fill="#d40000"/>
  <circle cx="320" cy="160" r="4" fill="#d40000"/>
  <circle cx="200" cy="280" r="4" fill="#d40000"/>
  <circle cx="80" cy="160" r="4" fill="#d40000"/>
  <text x="192" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a1a">A</text>
  <text x="328" y="156" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a1a">B</text>
  <text x="192" y="300" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a1a">C</text>
  <text x="58" y="156" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a1a">D</text>
  <path d="M 200 40 L 215 55 L 200 70" fill="none" stroke="#d40000" stroke-width="2"/>
  <text x="222" y="62" font-family="Arial" font-size="14" fill="#d40000">85°</text>
  <text x="200" y="160" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">?</text>
  <text x="200" y="178" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">angle C</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Opposite angles of cyclic quadrilateral are supplementary.</div><div class='ans'>$180° - 110° = 70°$.</div></div>
