<div class="wrap">
  <a class="back" href="DSE_Maths_Exercise.html">← Back to Exercises</a>
  <div class="meta">Coordinate Geometry (117) · Sub-Topic: Distance/Slope</div>
  <h1>T12 Q03</h1>
  <div class="card q">Find the midpoint of the line segment joining $A(2,4)$ and $B(8,10)$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="200" y="24" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Midpoint of segment AB</text>

  <!-- Coordinate axes -->
  <!-- x-axis -->
  <line x1="50" y1="270" x2="370" y2="270" stroke="#333" stroke-width="1.5"/>
  <polygon points="370,270 362,266 362,274" fill="#333"/>
  <text x="376" y="275" font-family="Arial, sans-serif" font-size="12" fill="#333">x</text>
  <!-- y-axis -->
  <line x1="50" y1="270" x2="50" y2="40" stroke="#333" stroke-width="1.5"/>
  <polygon points="50,40 46,48 54,48" fill="#333"/>
  <text x="40" y="38" font-family="Arial, sans-serif" font-size="12" fill="#333">y</text>

  <!-- Grid lines (light) -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="90" y1="270" x2="90" y2="50"/>
    <line x1="130" y1="270" x2="130" y2="50"/>
    <line x1="170" y1="270" x2="170" y2="50"/>
    <line x1="210" y1="270" x2="210" y2="50"/>
    <line x1="250" y1="270" x2="250" y2="50"/>
    <line x1="290" y1="270" x2="290" y2="50"/>
    <line x1="330" y1="270" x2="330" y2="50"/>
    <line x1="50" y1="230" x2="370" y2="230"/>
    <line x1="50" y1="190" x2="370" y2="190"/>
    <line x1="50" y1="150" x2="370" y2="150"/>
    <line x1="50" y1="110" x2="370" y2="110"/>
    <line x1="50" y1="70" x2="370" y2="70"/>
  </g>

  <!-- Scale: 1 unit = 40px, origin at (50,270) -->
  <!-- A(2,4) -> (50+2*40, 270-4*40) = (130,110) -->
  <!-- B(8,10) -> (50+8*40, 270-10*40) = (370, -130) -> off screen! Need smaller scale -->
  <!-- Use 1 unit = 30px: A(2,4)->(110,150), B(8,10)->(290, -30) still off -->
  <!-- Use 1 unit = 25px: A(2,4)->(100,170), B(8,10)->(250,20) -->
  <!-- Let's use 1 unit = 25px, origin (50,270) -->
  <!-- A(2,4) -> (50+50, 270-100) = (100,170) -->
  <!-- B(8,10) -> (50+200, 270-250) = (250,20) -->
  <!-- M(5,7) -> (50+125, 270-175) = (175,95) -->

  <!-- Segment AB -->
  <line x1="100" y1="170" x2="250" y2="20" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Point A -->
  <circle cx="100" cy="170" r="5" fill="#dc2626"/>
  <text x="82" y="188" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">A(2,4)</text>

  <!-- Point B -->
  <circle cx="250" cy="20" r="5" fill="#dc2626"/>
  <text x="258" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">B(8,10)</text>

  <!-- Midpoint M -->
  <circle cx="175" cy="95" r="5" fill="#16a34a"/>
  <text x="183" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">M(5,7)</text>

  <!-- Dashed guide lines from A -->
  <line x1="100" y1="170" x2="100" y2="270" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="170" x2="100" y2="170" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Dashed guide lines from B -->
  <line x1="250" y1="20" x2="250" y2="270" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="20" x2="250" y2="20" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Dashed guide lines from M -->
  <line x1="175" y1="95" x2="175" y2="270" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="95" x2="175" y2="95" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Axis tick labels -->
  <text x="95" y="285" font-family="Arial, sans-serif" font-size="10" fill="#555">2</text>
  <text x="245" y="285" font-family="Arial, sans-serif" font-size="10" fill="#555">8</text>
  <text x="170" y="285" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">5</text>
  <text x="42" y="174" font-family="Arial, sans-serif" font-size="10" fill="#555">4</text>
  <text x="42" y="24" font-family="Arial, sans-serif" font-size="10" fill="#555">10</text>
  <text x="42" y="99" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">7</text>

  <!-- Origin label -->
  <text x="38" y="285" font-family="Arial, sans-serif" font-size="10" fill="#555">O</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Midpoint $= (\tfrac{2+8}{2}, \tfrac{4+10}{2}) = (5,7)$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2025_P1_Q4.html">2025 P1 Q4 ↗</a></div>
</div>
