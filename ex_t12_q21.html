  <h1>T12 Q21</h1>
  <div class="card q">Find the $y$-intercept of the straight line $y = 3x + 4$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff" rx="10"/>

  <!-- Grid lines (light) -->
  <g stroke="#dce6f0" stroke-width="1">
    <line x1="60" y1="40" x2="60" y2="280"/>
    <line x1="110" y1="40" x2="110" y2="280"/>
    <line x1="160" y1="40" x2="160" y2="280"/>
    <line x1="210" y1="40" x2="210" y2="280"/>
    <line x1="260" y1="40" x2="260" y2="280"/>
    <line x1="310" y1="40" x2="310" y2="280"/>
    <line x1="60" y1="40" x2="340" y2="40"/>
    <line x1="60" y1="90" x2="340" y2="90"/>
    <line x1="60" y1="140" x2="340" y2="140"/>
    <line x1="60" y1="190" x2="340" y2="190"/>
    <line x1="60" y1="240" x2="340" y2="240"/>
  </g>

  <!-- Axes -->
  <g stroke="#333" stroke-width="2">
    <!-- x-axis -->
    <line x1="40" y1="240" x2="360" y2="240"/>
    <polygon points="360,240 350,235 350,245" fill="#333"/>
    <!-- y-axis -->
    <line x1="60" y1="290" x2="60" y2="30"/>
    <polygon points="60,30 55,40 65,40" fill="#333"/>
  </g>

  <!-- Axis labels -->
  <text x="365" y="245" font-family="Arial" font-size="14" fill="#333">x</text>
  <text x="45" y="35" font-family="Arial" font-size="14" fill="#333">y</text>
  <text x="45" y="255" font-family="Arial" font-size="12" fill="#333">O</text>

  <!-- Line y = 3x + 4 -->
  <!-- At x=0, y=4 -> point (60, 240 - 4*25) = (60, 140) -->
  <!-- At x=2, y=10 -> point (60+2*50, 240-10*25) = (160, -10) off screen -->
  <!-- Use x from -0.5 to 1.5: y from 2.5 to 8.5 -->
  <!-- x=0 -> (60,140); x=1.5 -> (60+75, 240-8.5*25)=(135, 27.5) -->
  <line x1="35" y1="177.5" x2="135" y2="27.5" stroke="#e63946" stroke-width="3" stroke-linecap="round"/>

  <!-- y-intercept point -->
  <circle cx="60" cy="140" r="5" fill="#e63946"/>
  <text x="70" y="135" font-family="Arial" font-size="13" fill="#e63946" font-weight="bold">(0, 4)</text>

  <!-- Equation label -->
  <rect x="200" y="60" width="150" height="50" rx="8" fill="#fff3cd" stroke="#e6a817" stroke-width="1.5"/>
  <text x="215" y="82" font-family="Arial" font-size="14" fill="#333">y = 3x + 4</text>
  <text x="215" y="100" font-family="Arial" font-size="12" fill="#666">y-intercept = ?</text>

  <!-- Tick marks on y-axis -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="55" y1="140" x2="65" y2="140"/>
    <line x1="55" y1="190" x2="65" y2="190"/>
    <line x1="55" y1="90" x2="65" y2="90"/>
  </g>
  <text x="30" y="145" font-family="Arial" font-size="11" fill="#333">4</text>
  <text x="30" y="195" font-family="Arial" font-size="11" fill="#333">2</text>
  <text x="30" y="95" font-family="Arial" font-size="11" fill="#333">6</text>

  <!-- Tick marks on x-axis -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="110" y1="235" x2="110" y2="245"/>
    <line x1="160" y1="235" x2="160" y2="245"/>
  </g>
  <text x="105" y="260" font-family="Arial" font-size="11" fill="#333">1</text>
  <text x="155" y="260" font-family="Arial" font-size="11" fill="#333">2</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$y$-intercept $= 4$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2022_P1_Q7.html">2022 P1 Q7 ↗</a></div>
</div>
