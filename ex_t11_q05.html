  <div class="meta">Geometry (106) · Sub-Topic: Angles in Triangles/Polygons</div>
  <h1>T11 Q05</h1>
  <div class="card q">In a triangle, two of the angles are \(40^\circ\) and \(70^\circ\). Find the third angle.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f0f8ff"/>
  <polygon points="60,260 340,260 200,60" fill="#ffe4b5" stroke="#d2691e" stroke-width="3"/>
  <text x="95" y="245" font-size="18" fill="#333" font-family="Arial">40°</text>
  <text x="290" y="245" font-size="18" fill="#333" font-family="Arial">70°</text>
  <text x="185" y="100" font-size="18" fill="#333" font-family="Arial">?</text>
  <text x="150" y="300" font-size="16" fill="#555" font-family="Arial">Find the third angle</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Third angle $= 180° - 40° - 70° = 70°$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2024_P2_Q18.html">2024 P2 Q18 ↗</a></div>
