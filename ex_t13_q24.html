  <h1>T13 Q24</h1>
  <div class="card q">A triangle has side lengths $6$, $8$, and $10$. Determine whether it is a right-angled triangle.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a3a6b">Triangle with sides 6, 8, 10</text>

  <!-- Triangle vertices: A(60,260), B(260,260), C(260,110) -->
  <!-- Right angle at B -->
  <polygon points="60,260 260,260 260,110" fill="#d6ecff" stroke="#1f6feb" stroke-width="3"/>

  <!-- Right angle marker at B -->
  <polyline points="240,260 240,240 260,240" fill="none" stroke="#e63946" stroke-width="2.5"/>

  <!-- Side labels -->
  <!-- AB = 8 (bottom) -->
  <text x="160" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a3a6b">8</text>
  <!-- BC = 6 (right vertical) -->
  <text x="278" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a3a6b">6</text>
  <!-- AC = 10 (hypotenuse) -->
  <text x="145" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a3a6b">10</text>

  <!-- Vertex labels -->
  <text x="45" y="275" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">A</text>
  <text x="268" y="278" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">B</text>
  <text x="268" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">C</text>

  <!-- Check note -->
  <text x="200" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">Check: 6² + 8² = 36 + 64 = 100 = 10²</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$6$-$8$-$10$: right angle.</div><div class='ans'>$\angle C = 90°$.</div></div>
