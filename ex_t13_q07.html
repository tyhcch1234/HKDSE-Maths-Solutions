  <h1>T13 Q07</h1>
  <div class="card q">In a right-angled triangle, the hypotenuse is $10$ and one angle is $30^\circ$. Find the length of the side opposite the $30^\circ$ angle.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f0f8ff" rx="10"/>

  <!-- Triangle vertices: A (bottom-left, right angle), B (bottom-right), C (top-left) -->
  <!-- A = (80, 250), B = (80 + 10*cos(30°)*scale, 250), C = (80, 250 - 10*sin(30°)*scale) -->
  <!-- Scale = 20 px per unit. Hypotenuse = 10 units = 200 px -->
  <!-- Angle at B = 30°, so side AC (opposite) = 10*sin(30°) = 5 units = 100 px -->
  <!-- Side AB (adjacent) = 10*cos(30°) ≈ 8.66 units ≈ 173.2 px -->

  <!-- Triangle fill -->
  <polygon points="80,250 253.2,250 80,150" fill="#ffe4b5" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right angle marker at A -->
  <polyline points="80,230 100,230 100,250" fill="none" stroke="#e63946" stroke-width="2.5"/>

  <!-- Angle arc at B (30 degrees) -->
  <path d="M 233.2,250 A 20,20 0 0,0 244.6,240.0" fill="none" stroke="#e63946" stroke-width="2.5"/>
  <text x="225" y="242" font-size="16" fill="#e63946" font-family="Arial" font-weight="bold">30°</text>

  <!-- Labels for vertices -->
  <text x="68" y="268" font-size="16" fill="#333" font-family="Arial" font-weight="bold">A</text>
  <text x="258" y="268" font-size="16" fill="#333" font-family="Arial" font-weight="bold">B</text>
  <text x="68" y="145" font-size="16" fill="#333" font-family="Arial" font-weight="bold">C</text>

  <!-- Hypotenuse label (BC = 10) -->
  <text x="175" y="190" font-size="16" fill="#1d3557" font-family="Arial" font-weight="bold" transform="rotate(-30, 175, 190)">10</text>

  <!-- Side AC label (opposite, unknown) -->
  <text x="55" y="205" font-size="16" fill="#2a9d8f" font-family="Arial" font-weight="bold">?</text>

  <!-- Side AB label (adjacent) -->
  <text x="160" y="270" font-size="16" fill="#6a4c93" font-family="Arial" font-weight="bold">adjacent</text>

  <!-- Title -->
  <text x="200" y="30" font-size="18" fill="#1d3557" font-family="Arial" font-weight="bold" text-anchor="middle">Right-Angled Triangle</text>

  <!-- Subtitle -->
  <text x="200" y="52" font-size="13" fill="#555" font-family="Arial" text-anchor="middle">Hypotenuse = 10, angle = 30°</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Opposite $= 10\sin30° = 5$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2017_P2_Q39.html">2017 P2 Q39 ↗</a></div>
</div>
