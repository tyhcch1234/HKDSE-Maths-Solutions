  <h1>T11 Q49</h1>
  <div class="card q">How many edges does a square pyramid have?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f3b73">Square Pyramid</text>

  <!-- base square (perspective) -->
  <polygon points="120,240 280,240 320,190 160,190" fill="#d9ecff" stroke="#2f6db3" stroke-width="3" stroke-linejoin="round"/>

  <!-- hidden back edges (dashed) -->
  <line x1="160" y1="190" x2="200" y2="80" stroke="#7aa7d9" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="320" y1="190" x2="200" y2="80" stroke="#7aa7d9" stroke-width="2.5" stroke-dasharray="7 6"/>

  <!-- visible side edges -->
  <line x1="120" y1="240" x2="200" y2="80" stroke="#e05a47" stroke-width="3.5"/>
  <line x1="280" y1="240" x2="200" y2="80" stroke="#e05a47" stroke-width="3.5"/>

  <!-- apex -->
  <circle cx="200" cy="80" r="5" fill="#e05a47"/>

  <!-- base vertices -->
  <circle cx="120" cy="240" r="4.5" fill="#2f6db3"/>
  <circle cx="280" cy="240" r="4.5" fill="#2f6db3"/>
  <circle cx="320" cy="190" r="4.5" fill="#2f6db3"/>
  <circle cx="160" cy="190" r="4.5" fill="#2f6db3"/>

  <!-- labels -->
  <text x="200" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e05a47">apex</text>
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2f6db3">square base</text>

  <!-- edge count note -->
  <text x="200" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f3b73">4 base edges + 4 slant edges = 8 edges</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>A square pyramid has 8 edges.</div></div>
