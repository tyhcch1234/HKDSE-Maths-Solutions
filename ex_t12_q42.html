  <h1>T12 Q42</h1>
  <div class="card q">Find the equation of the locus of a point which is always at a distance of $3$ from the origin.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Axes -->
  <line x1="40" y1="160" x2="360" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="20" x2="200" y2="300" stroke="#333" stroke-width="2"/>
  <polygon points="360,160 350,155 350,165" fill="#333"/>
  <polygon points="200,20 195,30 205,30" fill="#333"/>
  <text x="365" y="165" font-size="14" fill="#333">x</text>
  <text x="205" y="18" font-size="14" fill="#333">y</text>

  <!-- Origin -->
  <circle cx="200" cy="160" r="3" fill="#333"/>
  <text x="185" y="178" font-size="14" fill="#333">O</text>

  <!-- Locus circle: radius 3 units, scale 40px per unit => r=120 -->
  <circle cx="200" cy="160" r="120" fill="none" stroke="#e63946" stroke-width="3" stroke-dasharray="8,5"/>

  <!-- Radius line to a point on circle -->
  <line x1="200" y1="160" x2="284.85" y2="75.15" stroke="#1d3557" stroke-width="2"/>
  <circle cx="284.85" cy="75.15" r="4" fill="#1d3557"/>
  <text x="290" y="70" font-size="13" fill="#1d3557">P(x, y)</text>

  <!-- Distance label -->
  <text x="225" y="105" font-size="14" fill="#1d3557" font-weight="bold">3</text>

  <!-- Right angle marker at origin -->
  <rect x="200" y="145" width="15" height="15" fill="none" stroke="#888" stroke-width="1"/>

  <!-- Locus label -->
  <text x="255" y="200" font-size="13" fill="#e63946" font-weight="bold">locus</text>
  <text x="255" y="216" font-size="12" fill="#e63946">x² + y² = 9</text>

  <!-- Tick marks on axes -->
  <line x1="240" y1="156" x2="240" y2="164" stroke="#333" stroke-width="1.5"/>
  <line x1="280" y1="156" x2="280" y2="164" stroke="#333" stroke-width="1.5"/>
  <line x1="320" y1="156" x2="320" y2="164" stroke="#333" stroke-width="1.5"/>
  <line x1="196" y1="120" x2="204" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="196" y1="80" x2="204" y2="80" stroke="#333" stroke-width="1.5"/>
  <line x1="196" y1="40" x2="204" y2="40" stroke="#333" stroke-width="1.5"/>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Circle centre origin radius $3$: $x^2+y^2=9$.</div></div>
