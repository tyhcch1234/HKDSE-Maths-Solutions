  <h1>T11 Q44</h1>
  <div class="card q">How many faces does a square pyramid have?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="100%" stop-color="#4a9fc7"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6c85f"/>
      <stop offset="100%" stop-color="#e0a83a"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f28b82"/>
      <stop offset="100%" stop-color="#d96a60"/>
    </linearGradient>
    <linearGradient id="faceFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81c995"/>
      <stop offset="100%" stop-color="#5aa872"/>
    </linearGradient>
  </defs>

  <!-- Square base (parallelogram in perspective) -->
  <polygon points="100,240 300,240 340,200 140,200" fill="url(#baseGrad)" stroke="#2b6b85" stroke-width="2"/>

  <!-- Apex -->
  <circle cx="220" cy="60" r="4" fill="#333"/>

  <!-- Front face (triangle) -->
  <polygon points="220,60 100,240 300,240" fill="url(#faceFront)" stroke="#3a7a52" stroke-width="2" opacity="0.95"/>

  <!-- Left face -->
  <polygon points="220,60 100,240 140,200" fill="url(#faceLeft)" stroke="#b8862a" stroke-width="2" opacity="0.95"/>

  <!-- Right face -->
  <polygon points="220,60 300,240 340,200" fill="url(#faceRight)" stroke="#b04a42" stroke-width="2" opacity="0.95"/>

  <!-- Back edges (dashed) -->
  <line x1="220" y1="60" x2="140" y2="200" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="220" y1="60" x2="340" y2="200" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="140" y1="200" x2="340" y2="200" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Labels -->
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Square base</text>
  <text x="220" y="45" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Apex</text>

  <!-- Face count callout -->
  <text x="200" y="312" font-family="Arial, sans-serif" font-size="15" fill="#1a5276" text-anchor="middle" font-weight="bold">Faces: 1 base + 4 triangular = 5</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>A square pyramid has 5 faces.</div></div>
