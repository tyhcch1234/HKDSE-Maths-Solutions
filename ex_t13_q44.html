  <h1>T13 Q44</h1>
  <div class="card q">A vertical mast is supported by a wire of length $100$ m that makes an angle of $30°$ with the horizontal ground. Find the height of the mast.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Sky background -->
  <rect x="0" y="0" width="400" height="320" fill="#e8f4fd"/>
  
  <!-- Ground -->
  <rect x="0" y="250" width="400" height="70" fill="#8bc34a"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#5d8a2e" stroke-width="2"/>
  
  <!-- Mast (vertical) -->
  <rect x="195" y="60" width="10" height="190" fill="#e53935" rx="2"/>
  <rect x="190" y="55" width="20" height="10" fill="#b71c1c" rx="2"/>
  
  <!-- Wire from top of mast to ground -->
  <line x1="200" y1="60" x2="340" y2="250" stroke="#1565c0" stroke-width="3"/>
  
  <!-- Right angle marker at base of mast -->
  <polyline points="200,235 215,235 215,250" fill="none" stroke="#333" stroke-width="1.5"/>
  
  <!-- Angle arc at ground -->
  <path d="M 270 250 A 70 70 0 0 0 258 218" fill="none" stroke="#ff6f00" stroke-width="2"/>
  
  <!-- Angle label -->
  <text x="275" y="235" font-family="Arial" font-size="14" fill="#ff6f00" font-weight="bold">30°</text>
  
  <!-- Wire length label -->
  <text x="255" y="145" font-family="Arial" font-size="14" fill="#1565c0" font-weight="bold" transform="rotate(38, 255, 145)">100 m</text>
  
  <!-- Height label -->
  <text x="215" y="160" font-family="Arial" font-size="14" fill="#e53935" font-weight="bold">h</text>
  
  <!-- Ground label -->
  <text x="60" y="270" font-family="Arial" font-size="13" fill="#33691e">ground</text>
  
  <!-- Small grass tufts -->
  <path d="M 50 250 Q 55 240 60 250" fill="none" stroke="#5d8a2e" stroke-width="1.5"/>
  <path d="M 120 250 Q 125 238 130 250" fill="none" stroke="#5d8a2e" stroke-width="1.5"/>
  <path d="M 300 250 Q 305 240 310 250" fill="none" stroke="#5d8a2e" stroke-width="1.5"/>
  <path d="M 360 250 Q 365 238 370 250" fill="none" stroke="#5d8a2e" stroke-width="1.5"/>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Height $= 100\sin30° = 50$ m.</div></div>
