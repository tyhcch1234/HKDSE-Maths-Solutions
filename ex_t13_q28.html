  <h1>T13 Q28</h1>
  <div class="card q">In triangle \(ABC\), \(a=4\), \(b=5\) and \(c=6\). Find \(\cos A\).</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#ffffff"/>
  <polygon points="80,260 320,260 180,80" fill="#e8f4ff" stroke="#1a6fc4" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="80" cy="260" r="4" fill="#1a6fc4"/>
  <circle cx="320" cy="260" r="4" fill="#1a6fc4"/>
  <circle cx="180" cy="80" r="4" fill="#1a6fc4"/>
  <text x="62" y="278" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a6fc4">A</text>
  <text x="326" y="278" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a6fc4">B</text>
  <text x="172" y="68" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a6fc4">C</text>
  <text x="190" y="278" font-family="Arial, sans-serif" font-size="16" fill="#333333">c = 6</text>
  <text x="228" y="160" font-family="Arial, sans-serif" font-size="16" fill="#333333">a = 4</text>
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="16" fill="#333333">b = 5</text>
  <path d="M 108 260 A 28 28 0 0 0 100 242" fill="none" stroke="#e05a00" stroke-width="2"/>
  <text x="112" y="248" font-family="Arial, sans-serif" font-size="15" fill="#e05a00">A</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$\cos A = \tfrac{25+36-16}{60} = \tfrac34$.</div></div>
