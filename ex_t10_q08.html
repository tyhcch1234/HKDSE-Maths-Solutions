  <h1>T10 Q08</h1>
  <div class="card q">A rhombus has diagonals of lengths $12$ cm and $16$ cm. Find its area.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Rhombus with Diagonals 12 cm and 16 cm</text>

  <!-- Rhombus vertices: center at (200,175), half-diagonals 8 (horizontal) and 6 (vertical) -->
  <!-- Scaled: 1 cm = 12 px, so half-diag horizontal = 8*12=96, vertical = 6*12=72 -->
  <!-- Vertices: left(104,175), top(200,103), right(296,175), bottom(200,247) -->
  <polygon points="104,175 200,103 296,175 200,247" fill="#aed6f1" stroke="#2980b9" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Diagonal 1: horizontal (16 cm) -->
  <line x1="104" y1="175" x2="296" y2="175" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Diagonal 2: vertical (12 cm) -->
  <line x1="200" y1="103" x2="200" y2="247" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Right angle marker at center -->
  <rect x="200" y="163" width="12" height="12" fill="none" stroke="#555" stroke-width="1.5"/>

  <!-- Center dot -->
  <circle cx="200" cy="175" r="3" fill="#2c3e50"/>

  <!-- Labels for diagonals -->
  <text x="200" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e74c3c" font-weight="bold">16 cm</text>
  <text x="212" y="180" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#27ae60" font-weight="bold">12 cm</text>

  <!-- Vertex labels -->
  <text x="92" y="180" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">A</text>
  <text x="200" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">B</text>
  <text x="306" y="180" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">C</text>
  <text x="200" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">D</text>

  <!-- Formula hint at bottom -->
  <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Area = (1/2) x d1 x d2</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Area $= \tfrac12 d_1 d_2 = \tfrac12\times12\times16 = 96$ cm².</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2025_P1_Q14.html">2025 P1 Q14 ↗</a></div>
</div>
