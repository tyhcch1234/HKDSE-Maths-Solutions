  <h1>T10 Q09</h1>
  <div class="card q">A circle has a radius of $5$ cm. Find its area, taking $\pi = 3.14$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <circle cx="200" cy="160" r="100" fill="#bfe3ff" stroke="#1f6fb2" stroke-width="3"/>
  <line x1="200" y1="160" x2="300" y2="160" stroke="#d9480f" stroke-width="3"/>
  <circle cx="200" cy="160" r="4" fill="#d9480f"/>
  <text x="238" y="150" font-family="Arial, sans-serif" font-size="18" fill="#d9480f" font-weight="bold">5 cm</text>
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="18" fill="#1f6fb2" text-anchor="middle">radius = 5 cm</text>
  <text x="200" y="35" font-family="Arial, sans-serif" font-size="20" fill="#1f6fb2" text-anchor="middle" font-weight="bold">Area of a circle</text>
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle">Take pi = 3.14</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$r = 5$ cm. Area $= \pi r^2 = 3.14\times25 = 78.5$ cm².</div></div>
