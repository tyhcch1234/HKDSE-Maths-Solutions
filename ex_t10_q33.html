  <h1>T10 Q33</h1>
  <div class="card q">Find the total surface area of a sphere with radius $7$ cm. (Take $\pi = \tfrac{22}{7}$.)</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="55%" stop-color="#3aa0e8"/>
      <stop offset="100%" stop-color="#1565a8"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="320" fill="#f7fbff" rx="10"/>

  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a3d5c" text-anchor="middle">Sphere</text>

  <!-- Sphere -->
  <circle cx="200" cy="165" r="95" fill="url(#sphereGrad)" stroke="#0d4a7a" stroke-width="2.5"/>

  <!-- Highlight -->
  <ellipse cx="168" cy="128" rx="30" ry="20" fill="#ffffff" opacity="0.35" transform="rotate(-25 168 128)"/>

  <!-- Radius line -->
  <line x1="200" y1="165" x2="295" y2="165" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="200" cy="165" r="3.5" fill="#c0392b"/>
  <circle cx="295" cy="165" r="3.5" fill="#c0392b"/>

  <!-- Radius label -->
  <text x="247" y="155" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">7 cm</text>

  <!-- Center dot label -->
  <text x="200" y="185" font-family="Arial, sans-serif" font-size="12" fill="#0d4a7a" text-anchor="middle">O</text>

  <!-- Formula box -->
  <rect x="70" y="275" width="260" height="34" rx="8" fill="#e8f4ff" stroke="#3aa0e8" stroke-width="1.5"/>
  <text x="200" y="297" font-family="Arial, sans-serif" font-size="14" fill="#1a3d5c" text-anchor="middle">Total surface area = 4 pi r^2</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>TSA $= 4\pi r^2 = 4\times\tfrac{22}{7}\times49 = 616$ cm².</div></div>
