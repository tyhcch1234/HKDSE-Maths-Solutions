  <div class="meta">Geometry (106) · Sub-Topic: Circle Properties</div>
  <h1>T11 Q19</h1>
  <div class="card q">In the figure, $A$, $B$, $C$ and $D$ lie on a circle. If $\angle ACB = 35^\circ$, find $\angle ADB$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#ffffff"/>
  <circle cx="200" cy="160" r="110" fill="#eaf4ff" stroke="#2b6cb0" stroke-width="2.5"/>
  <circle cx="200" cy="160" r="3" fill="#2b6cb0"/>
  <text x="200" y="152" font-size="13" fill="#2b6cb0" text-anchor="middle" font-family="Arial">O</text>

  <!-- Points on circle: A top-left, B top-right, C bottom-right, D bottom-left -->
  <circle cx="120" cy="80" r="4" fill="#e53e3e"/>
  <text x="108" y="72" font-size="15" fill="#e53e3e" font-family="Arial" font-weight="bold">A</text>

  <circle cx="290" cy="95" r="4" fill="#38a169"/>
  <text x="298" y="90" font-size="15" fill="#38a169" font-family="Arial" font-weight="bold">B</text>

  <circle cx="285" cy="245" r="4" fill="#805ad5"/>
  <text x="293" y="258" font-size="15" fill="#805ad5" font-family="Arial" font-weight="bold">C</text>

  <circle cx="115" cy="235" r="4" fill="#dd6b20"/>
  <text x="98" y="250" font-size="15" fill="#dd6b20" font-family="Arial" font-weight="bold">D</text>

  <!-- Chords AC and BC forming angle ACB -->
  <line x1="120" y1="80" x2="285" y2="245" stroke="#805ad5" stroke-width="2"/>
  <line x1="290" y1="95" x2="285" y2="245" stroke="#38a169" stroke-width="2"/>

  <!-- Chords AD and BD forming angle ADB -->
  <line x1="120" y1="80" x2="115" y2="235" stroke="#dd6b20" stroke-width="2"/>
  <line x1="290" y1="95" x2="115" y2="235" stroke="#dd6b20" stroke-width="2"/>

  <!-- Angle arc at C -->
  <path d="M 262 232 A 28 28 0 0 0 268 218" fill="none" stroke="#805ad5" stroke-width="2"/>
  <text x="245" y="222" font-size="13" fill="#805ad5" font-family="Arial">35°</text>

  <!-- Angle arc at D -->
  <path d="M 138 228 A 28 28 0 0 1 132 214" fill="none" stroke="#dd6b20" stroke-width="2"/>
  <text x="140" y="218" font-size="13" fill="#dd6b20" font-family="Arial">?</text>

  <!-- Title -->
  <text x="200" y="30" font-size="15" fill="#1a202c" text-anchor="middle" font-family="Arial" font-weight="bold">A, B, C, D lie on a circle</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Angles in the same segment are equal.</div><div class='ans'>$x = 35°$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2017_P1_Q8.html">2017 P1 Q8 ↗</a></div>
