  <div class="meta">Trigonometry (59) · Sub-Topic: Sine/Cosine Law</div>
  <h1>T13 Q20</h1>
  <div class="card q">In a triangle with sides \(a=5\), \(b=7\), and \(c=9\), which angle is the largest?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8f9fa" rx="8"/>

  <!-- Triangle vertices: A (top), B (bottom-left), C (bottom-right) -->
  <!-- Side a = BC = 5 (opposite A), b = AC = 7 (opposite B), c = AB = 9 (opposite C) -->
  <!-- Using coordinates: B=(60,260), C=(300,260), A computed so AB=9, AC=7 -->
  <!-- BC=240px represents 5 units => scale 48px/unit -->
  <!-- AB=9*48=432 too large; use scale 24px/unit: BC=120, AB=216, AC=168 -->
  <!-- B=(80,260), C=(200,260), BC=120 -->
  <!-- A: AB=216, AC=168. x^2+y^2=216^2, (x-120)^2+y^2=168^2 -->
  <!-- 216^2 - (x-120)^2 + ... solve: x^2 - (x-120)^2 = 216^2-168^2 => 240x-14400=17920 => x=134.67 -->
  <!-- y^2 = 216^2 - 134.67^2 = 46656-18136=28520 => y=168.9 -->
  <!-- Shift: B=(80,260), C=(200,260), A=(80+134.67, 260-168.9)=(214.67,91.1) -->

  <!-- Triangle fill -->
  <polygon points="214.7,91.1 80,260 200,260" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Vertex labels -->
  <text x="214.7" y="78" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1c7ed6" text-anchor="middle">A</text>
  <text x="66" y="275" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1c7ed6" text-anchor="middle">B</text>
  <text x="212" y="275" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1c7ed6" text-anchor="middle">C</text>

  <!-- Side labels -->
  <!-- Side a = BC = 5 (bottom) -->
  <text x="140" y="282" font-family="Arial, sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">a = 5</text>
  <!-- Side b = AC = 7 (right side) -->
  <text x="222" y="180" font-family="Arial, sans-serif" font-size="15" fill="#2f9e44" text-anchor="middle" font-weight="bold">b = 7</text>
  <!-- Side c = AB = 9 (left side) -->
  <text x="130" y="170" font-family="Arial, sans-serif" font-size="15" fill="#9c36b5" text-anchor="middle" font-weight="bold">c = 9</text>

  <!-- Angle arcs -->
  <!-- Angle A (largest, opposite side c=9) -->
  <path d="M 200.5,108.5 A 18,18 0 0,0 228.5,105" fill="none" stroke="#e03131" stroke-width="2.5"/>
  <text x="222" y="120" font-family="Arial, sans-serif" font-size="13" fill="#e03131" font-weight="bold">?</text>

  <!-- Angle B -->
  <path d="M 98,260 A 18,18 0 0,0 92,242" fill="none" stroke="#1971c2" stroke-width="2"/>
  <text x="100" y="248" font-family="Arial, sans-serif" font-size="12" fill="#1971c2">?</text>

  <!-- Angle C -->
  <path d="M 182,260 A 18,18 0 0,1 188,242" fill="none" stroke="#1971c2" stroke-width="2"/>
  <text x="178" y="248" font-family="Arial, sans-serif" font-size="12" fill="#1971c2">?</text>

  <!-- Title -->
  <text x="200" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#343a40" text-anchor="middle">Triangle with sides a=5, b=7, c=9</text>

  <!-- Hint -->
  <text x="200" y="308" font-family="Arial, sans-serif" font-size="12" fill="#868e96" text-anchor="middle">Which angle is the largest?</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Largest angle is opposite $c=9$.</div><div class='step'>$\cos C = \tfrac{25+49-81}{70} = -\tfrac{1}{10}$.</div></div>

</div>
