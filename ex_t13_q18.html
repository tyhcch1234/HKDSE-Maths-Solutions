  <h1>T13 Q18</h1>
  <div class="card q">In triangle $ABC$, $AB=6$, $BC=8$ and $\angle ABC=60^\circ$. Find $AC^2$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#ffffff"/>
  <polygon points="80,250 320,250 200,80" fill="#e8f4ff" stroke="#1a6fc4" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="80" cy="250" r="4" fill="#1a6fc4"/>
  <circle cx="320" cy="250" r="4" fill="#1a6fc4"/>
  <circle cx="200" cy="80" r="4" fill="#1a6fc4"/>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a6fc4">A</text>
  <text x="325" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a6fc4">C</text>
  <text x="195" y="68" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a6fc4">B</text>
  <text x="130" y="240" font-family="Arial, sans-serif" font-size="16" fill="#d94a1a">6</text>
  <text x="265" y="240" font-family="Arial, sans-serif" font-size="16" fill="#d94a1a">8</text>
  <text x="215" y="155" font-family="Arial, sans-serif" font-size="16" fill="#2a9d4a">AC = ?</text>
  <path d="M 110 250 A 30 30 0 0 0 95 228" fill="none" stroke="#d94a1a" stroke-width="2"/>
  <text x="108" y="232" font-family="Arial, sans-serif" font-size="14" fill="#d94a1a">60°</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$AC^2 = 6^2+8^2-2(6)(8)\cos60° = 100-48 = 52$.</div><div class='step'>$AC = 2\sqrt{13}$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2017_P2_Q38.html">2017 P2 Q38 ↗</a></div>
</div>
