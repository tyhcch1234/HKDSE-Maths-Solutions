  <h1>T13 Q15</h1>
  <div class="card q">What is the exact value of $\tan 30^\circ$?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f0f8ff"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">tan 30°</text>
  
  <!-- Triangle: 30-60-90 right triangle -->
  <!-- Right angle at B, 30° at A, 60° at C -->
  <!-- Sides: opposite to 30° = 1, hypotenuse = 2, adjacent = sqrt(3) -->
  <!-- Scale: 1 unit = 100px -->
  <!-- Place B at (100, 250), A at (100, 150), C at (273, 250) -->
  
  <polygon points="100,250 100,150 273,250" fill="#ffe4b5" stroke="#333" stroke-width="2"/>
  
  <!-- Right angle marker at B -->
  <polyline points="100,230 120,230 120,250" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Angle arc at A (30°) -->
  <path d="M 100,180 A 30,30 0 0,0 126,165" fill="none" stroke="#e63946" stroke-width="2"/>
  <text x="118" y="172" font-family="Arial" font-size="14" fill="#e63946">30°</text>
  
  <!-- Angle arc at C (60°) -->
  <path d="M 250,250 A 25,25 0 0,0 255,228" fill="none" stroke="#2a9d8f" stroke-width="2"/>
  <text x="240" y="238" font-family="Arial" font-size="14" fill="#2a9d8f">60°</text>
  
  <!-- Side labels -->
  <!-- Opposite side (AB) = 1 -->
  <text x="70" y="205" font-family="Arial" font-size="14" fill="#333">1</text>
  <!-- Adjacent side (BC) = sqrt(3) -->
  <text x="180" y="270" font-family="Arial" font-size="14" fill="#333">√3</text>
  <!-- Hypotenuse (AC) = 2 -->
  <text x="175" y="190" font-family="Arial" font-size="14" fill="#333">2</text>
  
  <!-- Vertex labels -->
  <text x="85" y="145" font-family="Arial" font-size="14" fill="#333">A</text>
  <text x="85" y="265" font-family="Arial" font-size="14" fill="#333">B</text>
  <text x="278" y="265" font-family="Arial" font-size="14" fill="#333">C</text>
  
  <!-- Formula box -->
  <rect x="120" y="285" width="160" height="28" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="304" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">tan 30° = 1 / √3</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$\tan30° = \tfrac{1}{\sqrt3} = \tfrac{\sqrt3}{3}$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2021_P2_Q24.html">2021 P2 Q24 ↗</a></div>
