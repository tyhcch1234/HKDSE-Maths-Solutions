  <h1>T10 Q43</h1>
  <div class="card q">The volumes of two similar solid spheres are in the ratio \(8:125\). Find the ratio of their radii.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f3b73">Similar Solid Spheres</text>

  <!-- Small sphere -->
  <circle cx="120" cy="150" r="48" fill="#7ec8e3" stroke="#1f6f9c" stroke-width="2"/>
  <ellipse cx="120" cy="150" rx="48" ry="16" fill="none" stroke="#1f6f9c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="120" y1="150" x2="168" y2="150" stroke="#d1495b" stroke-width="2"/>
  <circle cx="120" cy="150" r="2.5" fill="#d1495b"/>
  <text x="144" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d1495b">r</text>

  <!-- Large sphere -->
  <circle cx="285" cy="170" r="78" fill="#ffd166" stroke="#c98a00" stroke-width="2"/>
  <ellipse cx="285" cy="170" rx="78" ry="24" fill="none" stroke="#c98a00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="285" y1="170" x2="363" y2="170" stroke="#d1495b" stroke-width="2"/>
  <circle cx="285" cy="170" r="2.5" fill="#d1495b"/>
  <text x="324" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d1495b">R</text>

  <!-- Volume ratio box -->
  <rect x="95" y="255" width="210" height="42" rx="8" fill="#ffffff" stroke="#1f3b73" stroke-width="1.5"/>
  <text x="200" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f3b73">Volume ratio = 8 : 125</text>
  <text x="200" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f3b73">Find ratio of radii r : R</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Linear ratio $= 2:5$.</div><div class='step'>Volume ratio $= 8:125$.</div></div>
