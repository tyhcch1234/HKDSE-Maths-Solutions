  <h1>T12 Q27</h1>
  <div class="card q">Find the equation of the straight line whose $x$-intercept and $y$-intercept are $3$ and $6$ respectively.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#ffffff"/>
  <!-- axes -->
  <line x1="50" y1="260" x2="360" y2="260" stroke="#333333" stroke-width="2"/>
  <line x1="80" y1="300" x2="80" y2="30" stroke="#333333" stroke-width="2"/>
  <!-- arrowheads -->
  <polygon points="360,260 350,255 350,265" fill="#333333"/>
  <polygon points="80,30 75,40 85,40" fill="#333333"/>
  <!-- axis labels -->
  <text x="365" y="265" font-family="Arial" font-size="14" fill="#333333">x</text>
  <text x="85" y="25" font-family="Arial" font-size="14" fill="#333333">y</text>
  <text x="65" y="275" font-family="Arial" font-size="14" fill="#333333">O</text>
  <!-- line through intercepts (3,0) and (0,6) -->
  <!-- scale: 1 unit = 40px; origin at (80,260) -->
  <!-- x-intercept (3,0) -> (200,260); y-intercept (0,6) -> (80,20) -->
  <line x1="80" y1="20" x2="200" y2="260" stroke="#e63946" stroke-width="3"/>
  <!-- intercept points -->
  <circle cx="200" cy="260" r="5" fill="#1d3557"/>
  <circle cx="80" cy="20" r="5" fill="#1d3557"/>
  <!-- labels -->
  <text x="205" y="280" font-family="Arial" font-size="14" fill="#1d3557">(3, 0)</text>
  <text x="90" y="18" font-family="Arial" font-size="14" fill="#1d3557">(0, 6)</text>
  <!-- intercept markers on axes -->
  <text x="195" y="252" font-family="Arial" font-size="12" fill="#555555">3</text>
  <text x="60" y="25" font-family="Arial" font-size="12" fill="#555555">6</text>
  <!-- dashed guides -->
  <line x1="200" y1="260" x2="200" y2="255" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="20" x2="85" y2="20" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Intercepts $3$ and $6$: $y = -2x+6$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2018_P2_Q21.html">2018 P2 Q21 ↗</a></div>
