  <h1>T10 Q49</h1>
  <div class="card q">Two similar solid spheres have radii in the ratio $2:1$. Find the ratio of their volumes.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a3a6b">Similar Solid Spheres</text>
  <text x="200" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">Radii ratio = 2 : 1</text>

  <!-- Large sphere -->
  <circle cx="130" cy="180" r="85" fill="#4a90d9" fill-opacity="0.25" stroke="#2c6cb0" stroke-width="2.5"/>
  <ellipse cx="130" cy="180" rx="85" ry="28" fill="none" stroke="#2c6cb0" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>
  <line x1="130" y1="180" x2="215" y2="180" stroke="#d94a4a" stroke-width="2.5"/>
  <circle cx="130" cy="180" r="3" fill="#d94a4a"/>
  <text x="172" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d94a4a">2r</text>
  <text x="130" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c6cb0">Sphere A</text>

  <!-- Small sphere -->
  <circle cx="310" cy="200" r="42" fill="#f5a623" fill-opacity="0.3" stroke="#c47d0a" stroke-width="2.5"/>
  <ellipse cx="310" cy="200" rx="42" ry="14" fill="none" stroke="#c47d0a" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>
  <line x1="310" y1="200" x2="352" y2="200" stroke="#d94a4a" stroke-width="2.5"/>
  <circle cx="310" cy="200" r="3" fill="#d94a4a"/>
  <text x="331" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d94a4a">r</text>
  <text x="310" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c47d0a">Sphere B</text>

  <!-- Ratio note -->
  <text x="200" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Volume ratio = (2 : 1)³ = 8 : 1</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Volume ratio $= 2^3 = 8:1$.</div></div>
