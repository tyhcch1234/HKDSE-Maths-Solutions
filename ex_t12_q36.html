  <h1>T12 Q36</h1>
  <div class="card q">Find the equation of the circle with centre $(2,3)$ and radius $3$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">

  <!-- Axes -->
  <line x1="40" y1="260" x2="370" y2="260" stroke="#333" stroke-width="2"/>

  <!-- Circle: centre (2,3) radius 3 -->
  <!-- Scale: 1 unit = 40px. Centre at (80+2*40, 260-3*40) = (160, 140). Radius = 3*40 = 120px -->

  <!-- Title -->
  <text x="200" y="308" font-size="13" font-family="Arial" fill="#2c3e50" text-anchor="middle" font-weight="bold">Circle with centre (2, 3) and radius 3</text>

<h2>Solution</h2>
  <div class="card sol"><div class='step'>$(x-2)^2+(y-3)^2 = 9$.</div><div class='ans'>Centre $(2,3)$, radius $3$.</div></div>
