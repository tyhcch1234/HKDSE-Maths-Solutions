  <h1>T11 Q14</h1>
  <div class="card q">A regular polygon has 9 sides. Find the sum of its interior angles and the size of each interior angle.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f">Regular Polygon (9 sides)</text>
  <g transform="translate(200,175)">
    <polygon points="0,-110 70.5,-77.8 110,0 70.5,77.8 0,110 -70.5,77.8 -110,0 -70.5,-77.8 0,-110"
             fill="#ffe8a3" stroke="#e07a1f" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#e07a1f"/>
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#e07a1f" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="0" y1="0" x2="70.5" y2="-77.8" stroke="#e07a1f" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 0 -35 A 35 35 0 0 1 22.4 -24.7" fill="none" stroke="#2a7ab8" stroke-width="2"/>
    <text x="30" y="-28" font-family="Arial, sans-serif" font-size="12" fill="#2a7ab8">40°</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#1f3a5f">
    <text x="20" y="300">n = 9 sides</text>
    <text x="150" y="300">Sum of interior angles = (n - 2) × 180°</text>
  </g>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Sum $= 1260°$; each $= 1260°/9 = 140°$.</div></div>
