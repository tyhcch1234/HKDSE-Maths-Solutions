  <h1>T13 Q02</h1>
  <div class="card q">In a right-angled triangle, the side adjacent to angle $\theta$ is 4 and the hypotenuse is 5. Find $\cos\theta$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>
  
  <!-- Triangle vertices: A (right angle), B, C -->
  <!-- Place right angle at A(80, 250), B(80, 70), C(320, 250) -->
  <!-- Adjacent = AC = 4 units, Hypotenuse = BC = 5 units -->
  <!-- Scale: 1 unit = 60px, so AC = 240px, BC = 300px -->
  <!-- Check: AB = sqrt(5^2 - 4^2) = 3 units = 180px -->
  
  <!-- Triangle fill -->
  <polygon points="80,250 80,70 320,250" fill="#d4eaff" stroke="#1a6fb5" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Right angle marker at A -->
  <polyline points="80,230 100,230 100,250" fill="none" stroke="#1a6fb5" stroke-width="2.5"/>
  
  <!-- Angle theta arc at C -->
  <path d="M 290,250 A 30,30 0 0,0 296,228" fill="none" stroke="#e05a00" stroke-width="2.5"/>
  <text x="262" y="240" font-size="18" font-style="italic" fill="#e05a00" font-family="Georgia, serif">θ</text>
  
  <!-- Labels -->
  <!-- Adjacent side AC = 4 -->
  <text x="185" y="278" font-size="17" fill="#1a6fb5" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">4</text>
  
  <!-- Hypotenuse BC = 5 -->
  <text x="215" y="148" font-size="17" fill="#1a6fb5" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold" transform="rotate(-36.87, 215, 148)">5</text>
  
  <!-- Vertex labels -->
  <text x="62" y="265" font-size="16" fill="#333" font-family="Arial, sans-serif" font-weight="bold">A</text>
  <text x="62" y="62" font-size="16" fill="#333" font-family="Arial, sans-serif" font-weight="bold">B</text>
  <text x="328" y="265" font-size="16" fill="#333" font-family="Arial, sans-serif" font-weight="bold">C</text>
  
  <!-- Title -->
  <text x="200" y="30" font-size="16" fill="#333" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">Right-angled Triangle</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$\cos\theta = \tfrac{4}{5}$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2024_P2_Q23.html">2024 P2 Q23 ↗</a></div>
</div>
