  <h1>T13 Q12</h1>
  <div class="card q">Given that $\sin\theta = \frac{4}{5}$ and $\cos\theta = \frac{3}{5}$, find the value of $\tan\theta$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f3b73">Right Triangle for θ</text>

  <!-- Triangle vertices: A(80,260), B(320,260), C(320,80) -->
  <polygon points="80,260 320,260 320,80" fill="#dff3ff" stroke="#1f78b4" stroke-width="3"/>

  <!-- Right angle marker at B -->
  <polyline points="300,260 300,240 320,240" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Angle arc at A -->
  <path d="M 120 260 A 40 40 0 0 0 112 235" fill="none" stroke="#e31a1c" stroke-width="3"/>
  <text x="128" y="248" font-family="Arial, sans-serif" font-size="18" fill="#e31a1c" font-weight="bold">θ</text>

  <!-- Labels for sides -->
  <!-- Opposite side BC -->
  <text x="330" y="175" font-family="Arial, sans-serif" font-size="16" fill="#333">4</text>
  <!-- Adjacent side AB -->
  <text x="195" y="282" font-family="Arial, sans-serif" font-size="16" fill="#333">3</text>
  <!-- Hypotenuse AC -->
  <text x="185" y="155" font-family="Arial, sans-serif" font-size="16" fill="#333">5</text>

  <!-- Vertex labels -->
  <text x="65" y="275" font-family="Arial, sans-serif" font-size="14" fill="#333">A</text>
  <text x="325" y="275" font-family="Arial, sans-serif" font-size="14" fill="#333">B</text>
  <text x="325" y="75" font-family="Arial, sans-serif" font-size="14" fill="#333">C</text>

  <!-- Given info box -->
  <rect x="20" y="292" width="360" height="22" rx="5" fill="#fff7d6" stroke="#f0c419" stroke-width="1.5"/>
  <text x="200" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a5c00">sin θ = 4/5,  cos θ = 3/5</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$\tan\theta = \tfrac{\sin}{\cos} = \tfrac{4/5}{3/5} = \tfrac43$.</div></div>
