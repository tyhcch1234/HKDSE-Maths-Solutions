  <h1>T10 Q37</h1>
  <div class="card q">Find the total surface area of a cylinder with radius $5$ cm and height $12$ cm, using $\pi = 3.14$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="cylBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="50%" stop-color="#7EC8F0"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8DCF5"/>
      <stop offset="100%" stop-color="#6BB8E8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" fill="#FFFDF5"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Cylinder</text>

  <!-- Cylinder body (rectangle) -->
  <rect x="130" y="90" width="140" height="150" fill="url(#cylBody)" stroke="#2C6FA6" stroke-width="2"/>

  <!-- Bottom ellipse (back half hidden, front visible) -->
  <ellipse cx="200" cy="240" rx="70" ry="22" fill="#3A7FC0" stroke="#2C6FA6" stroke-width="2"/>
  <!-- Bottom ellipse front highlight -->
  <path d="M 130 240 A 70 22 0 0 0 270 240" fill="none" stroke="#2C6FA6" stroke-width="2"/>

  <!-- Top ellipse -->
  <ellipse cx="200" cy="90" rx="70" ry="22" fill="url(#topFace)" stroke="#2C6FA6" stroke-width="2"/>

  <!-- Radius line on top -->
  <line x1="200" y1="90" x2="270" y2="90" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="200" cy="90" r="3" fill="#E74C3C"/>
  <text x="238" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">5 cm</text>

  <!-- Height arrow -->
  <line x1="295" y1="90" x2="295" y2="240" stroke="#27AE60" stroke-width="2"/>
  <line x1="290" y1="90" x2="300" y2="90" stroke="#27AE60" stroke-width="2"/>
  <line x1="290" y1="240" x2="300" y2="240" stroke="#27AE60" stroke-width="2"/>
  <text x="315" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold" transform="rotate(90, 315, 170)">12 cm</text>

  <!-- Labels -->
  <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">radius = 5 cm, height = 12 cm</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>TSA $= 2\pi r(r+h) = 2\times3.14\times5\times17 = 533.8$ cm².</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2025_P2_Q16.html">2025 P2 Q16 ↗</a></div>
</div>
