  <h1>T12 Q35</h1>
  <div class="card q">Write down the equation of the circle with centre $(0,0)$ and radius $3$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Coordinate axes -->
  <line x1="40" y1="160" x2="360" y2="160" stroke="#555" stroke-width="1.5"/>
  <line x1="200" y1="20" x2="200" y2="300" stroke="#555" stroke-width="1.5"/>

  <!-- Arrowheads -->
  <polygon points="360,160 350,155 350,165" fill="#555"/>
  <polygon points="200,20 195,30 205,30" fill="#555"/>

  <!-- Axis labels -->
  <text x="365" y="164" font-size="13" fill="#333" font-family="Arial">x</text>
  <text x="205" y="18" font-size="13" fill="#333" font-family="Arial">y</text>

  <!-- Circle: centre (0,0), radius 3. Scale: 40px per unit -->
  <circle cx="200" cy="160" r="120" fill="#d6ecff" fill-opacity="0.55" stroke="#1e88e5" stroke-width="2.5"/>

  <!-- Centre point -->
  <circle cx="200" cy="160" r="3.5" fill="#e53935"/>
  <text x="207" y="176" font-size="12" fill="#e53935" font-family="Arial">(0,0)</text>

  <!-- Radius line to the right -->
  <line x1="200" y1="160" x2="320" y2="160" stroke="#e53935" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="252" y="153" font-size="13" fill="#e53935" font-family="Arial" font-weight="bold">r = 3</text>

  <!-- Tick marks on axes at radius -->
  <line x1="320" y1="155" x2="320" y2="165" stroke="#555" stroke-width="1.5"/>
  <text x="316" y="180" font-size="11" fill="#333" font-family="Arial">3</text>
  <line x1="195" y1="40" x2="205" y2="40" stroke="#555" stroke-width="1.5"/>
  <text x="208" y="44" font-size="11" fill="#333" font-family="Arial">3</text>
  <line x1="80" y1="155" x2="80" y2="165" stroke="#555" stroke-width="1.5"/>
  <text x="70" y="180" font-size="11" fill="#333" font-family="Arial">-3</text>
  <line x1="195" y1="280" x2="205" y2="280" stroke="#555" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="310" font-size="14" fill="#1e88e5" font-family="Arial" text-anchor="middle" font-weight="bold">Circle: centre (0,0), radius 3</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$x^2+y^2 = 9$.</div></div>
