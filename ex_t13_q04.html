  <h1>T13 Q04</h1>
  <div class="card q">Find the value of $\sin 30^\circ$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a3a6b">Find the value of sin 30°</text>

  <!-- Triangle -->
  <polygon points="80,260 320,260 320,120" fill="#d6ecff" stroke="#1a6fc4" stroke-width="3"/>

  <!-- Right angle marker at B (320,260) -->
  <polyline points="300,260 300,240 320,240" fill="none" stroke="#1a6fc4" stroke-width="2"/>

  <!-- Angle arc at A (80,260) -->
  <path d="M 120,260 A 40,40 0 0 0 114.6,240" fill="none" stroke="#e05a00" stroke-width="2.5"/>
  <text x="128" y="248" font-family="Arial, sans-serif" font-size="15" fill="#e05a00" font-weight="bold">30°</text>

  <!-- Labels -->
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1a3a6b">adjacent</text>
  <text x="332" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1a3a6b" transform="rotate(-90 332 195)">opposite</text>
  <text x="185" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1a3a6b" transform="rotate(-35 185 180)">hypotenuse</text>

  <!-- Vertex labels -->
  <text x="68" y="278" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a3a6b">A</text>
  <text x="326" y="278" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a3a6b">B</text>
  <text x="326" y="114" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a3a6b">C</text>

  <!-- Formula reminder -->
  <text x="200" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">sin 30° = opposite / hypotenuse</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$\sin30° = \tfrac12$.</div></div>
