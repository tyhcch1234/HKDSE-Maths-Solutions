  <h1>T11 Q42</h1>
  <div class="card q">How many faces does a triangular prism have?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a3a6b">Triangular Prism</text>

  <!-- Back triangular face -->
  <polygon points="120,90 260,70 210,170" fill="#b8d8f0" stroke="#2a5a9a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Front triangular face -->
  <polygon points="80,220 220,200 170,300" fill="#7ec8e3" stroke="#1a4a8a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Connecting edges -->
  <line x1="120" y1="90" x2="80" y2="220" stroke="#2a5a9a" stroke-width="2"/>
  <line x1="260" y1="70" x2="220" y2="200" stroke="#2a5a9a" stroke-width="2"/>
  <line x1="210" y1="170" x2="170" y2="300" stroke="#2a5a9a" stroke-width="2"/>

  <!-- Face labels -->
  <text x="160" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1a3a6b">Face 1</text>
  <text x="145" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0a2a5a">Face 2</text>
  <text x="95" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1a3a6b">Face 3</text>
  <text x="245" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1a3a6b">Face 4</text>
  <text x="195" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1a3a6b">Face 5</text>

  <!-- Answer note -->
  <text x="200" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold">A triangular prism has 5 faces.</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>A triangular prism has 5 faces.</div></div>
