  <div class="meta">Coordinate Geometry (117) · Sub-Topic: Locus</div>
  <h1>T12 Q46</h1>
  <div class="card q">A point $P(x,y)$ is equidistant from the lines $y=1$ and $x=2$. Describe the locus of $P$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#ffffff"/>

  <!-- Coordinate axes -->
  <!-- x-axis -->
  <line x1="40" y1="240" x2="370" y2="240" stroke="#333333" stroke-width="2"/>
  <polygon points="370,240 360,235 360,245" fill="#333333"/>
  <text x="375" y="245" font-size="14" fill="#333333" font-family="Arial">x</text>

  <!-- y-axis -->
  <line x1="80" y1="290" x2="80" y2="30" stroke="#333333" stroke-width="2"/>
  <polygon points="80,30 75,40 85,40" fill="#333333"/>
  <text x="65" y="25" font-size="14" fill="#333333" font-family="Arial">y</text>

  <!-- Origin label -->
  <text x="62" y="258" font-size="13" fill="#333333" font-family="Arial">O</text>

  <!-- Line y = 1 (horizontal) -->
  <line x1="40" y1="200" x2="370" y2="200" stroke="#e63946" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="340" y="192" font-size="13" fill="#e63946" font-family="Arial">y = 1</text>

  <!-- Line x = 2 (vertical) -->
  <line x1="160" y1="290" x2="160" y2="30" stroke="#2a9d8f" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="165" y="45" font-size="13" fill="#2a9d8f" font-family="Arial">x = 2</text>

  <!-- Intersection point (2,1) -->
  <circle cx="160" cy="200" r="4" fill="#333333"/>
  <text x="165" y="218" font-size="12" fill="#333333" font-family="Arial">(2, 1)</text>

  <!-- Locus: two perpendicular lines through (2,1) at 45 degrees -->
  <!-- Line 1: slope +1 through (160,200) -->
  <line x1="60" y1="300" x2="300" y2="60" stroke="#f4a261" stroke-width="3"/>
  <!-- Line 2: slope -1 through (160,200) -->
  <line x1="60" y1="100" x2="300" y2="300" stroke="#f4a261" stroke-width="3"/>

  <!-- Locus label -->
  <text x="255" y="85" font-size="13" fill="#e76f51" font-family="Arial" font-weight="bold">locus of P</text>

  <!-- Point P on one branch -->
  <circle cx="240" cy="120" r="5" fill="#6a4c93"/>
  <text x="248" y="115" font-size="13" fill="#6a4c93" font-family="Arial" font-weight="bold">P(x, y)</text>

  <!-- Right angle marker at intersection -->
  <polyline points="160,185 175,185 175,200" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- Tick marks on axes -->
  <line x1="160" y1="236" x2="160" y2="244" stroke="#333333" stroke-width="1.5"/>
  <text x="155" y="258" font-size="12" fill="#333333" font-family="Arial">2</text>

  <line x1="76" y1="200" x2="84" y2="200" stroke="#333333" stroke-width="1.5"/>
  <text x="55" y="204" font-size="12" fill="#333333" font-family="Arial">1</text>

  <!-- Title -->
  <text x="200" y="18" font-size="14" fill="#333333" font-family="Arial" text-anchor="middle" font-weight="bold">Locus of P equidistant from y = 1 and x = 2</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Two lines $y=3$ and $y=-1$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2023_P1_Q10.html">2023 P1 Q10 ↗</a></div>
</div>
