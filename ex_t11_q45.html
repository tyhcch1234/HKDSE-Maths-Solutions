  <h1>T11 Q45</h1>
  <div class="card q">What is the angle between two adjacent faces of a cube?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a3a6b">Angle between adjacent faces of a cube</text>

  <!-- Cube front face -->
  <polygon points="80,100 240,100 240,260 80,260" fill="#d6e8ff" stroke="#2b5ea7" stroke-width="2.5"/>

  <!-- Cube top face -->
  <polygon points="80,100 160,40 320,40 240,100" fill="#a8cdf5" stroke="#2b5ea7" stroke-width="2.5"/>

  <!-- Cube right face -->
  <polygon points="240,100 320,40 320,200 240,260" fill="#7fb3e8" stroke="#2b5ea7" stroke-width="2.5"/>

  <!-- Highlight adjacent faces: front and top -->
  <polygon points="80,100 240,100 240,260 80,260" fill="#ffd966" fill-opacity="0.35" stroke="#e6a800" stroke-width="2.5"/>
  <polygon points="80,100 160,40 320,40 240,100" fill="#ff9f43" fill-opacity="0.35" stroke="#e6a800" stroke-width="2.5"/>

  <!-- Shared edge highlight -->
  <line x1="80" y1="100" x2="240" y2="100" stroke="#d62828" stroke-width="4"/>

  <!-- Right angle marker at shared edge on front face -->
  <polyline points="100,100 100,120 80,120" fill="none" stroke="#d62828" stroke-width="2"/>

  <!-- Right angle marker on top face -->
  <polyline points="100,100 100,80 120,80" fill="none" stroke="#d62828" stroke-width="2"/>

  <!-- Angle arc between faces -->
  <path d="M 130,100 A 50,50 0 0 1 110,60" fill="none" stroke="#d62828" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="148" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d62828">90°</text>

  <!-- Labels -->
  <text x="160" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a6b">Front face</text>
  <text x="200" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a6b">Top face</text>

  <!-- Shared edge label -->
  <text x="160" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d62828" font-weight="bold">shared edge</text>

  <!-- Small cube icon for reference -->
  <g transform="translate(310, 230)">
    <polygon points="0,15 30,15 30,45 0,45" fill="#d6e8ff" stroke="#2b5ea7" stroke-width="1.5"/>
    <polygon points="0,15 12,5 42,5 30,15" fill="#a8cdf5" stroke="#2b5ea7" stroke-width="1.5"/>
    <polygon points="30,15 42,5 42,35 30,45" fill="#7fb3e8" stroke="#2b5ea7" stroke-width="1.5"/>
  </g>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Angle between two faces of a cube $= 90°$.</div></div>
