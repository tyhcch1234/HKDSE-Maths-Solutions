  <h1>T11 Q31</h1>
  <div class="card q">Two similar triangles have corresponding side lengths in the ratio $2:3$. Find the ratio of their areas.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a3a6b">Similar Triangles: Side Ratio 2 : 3</text>

  <!-- Small triangle (left) -->
  <polygon points="50,250 150,250 100,150" fill="#7ec8e3" stroke="#1a6fa0" stroke-width="2.5"/>
  <!-- Side labels small -->
  <text x="100" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a6b">2</text>
  <text x="68" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a6b">2</text>
  <text x="132" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a6b">2</text>
  <!-- Small triangle label -->
  <text x="100" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1a6fa0">Triangle 1</text>

  <!-- Big triangle (right) -->
  <polygon points="210,250 360,250 285,100" fill="#ffb347" stroke="#c46a00" stroke-width="2.5"/>
  <!-- Side labels big -->
  <text x="285" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8a4a00">3</text>
  <text x="238" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8a4a00">3</text>
  <text x="332" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8a4a00">3</text>
  <!-- Big triangle label -->
  <text x="285" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c46a00">Triangle 2</text>

  <!-- Ratio arrow between triangles -->
  <line x1="160" y1="200" x2="200" y2="200" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="180" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">similar</text>

  <!-- Area ratio box -->
  <rect x="110" y="300" width="180" height="16" rx="4" fill="#e8f4e8" stroke="#3a8a3a" stroke-width="1"/>
  <text x="200" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2a6a2a">Area ratio = 2² : 3² = 4 : 9</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Area ratio $= (\tfrac23)^2 = 4:9$.</div></div>
