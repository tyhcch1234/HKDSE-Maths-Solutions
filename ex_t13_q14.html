  <h1>T13 Q14</h1>
  <div class="card q">Find the value of $\cos 45^\circ$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f0f8ff" rx="10"/>

  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e">Find the value of cos 45°</text>

  <!-- Right triangle -->
  <!-- Vertices: A(80,260) bottom-left, B(280,260) bottom-right, C(280,100) top-right -->
  <polygon points="80,260 280,260 280,100" fill="#e8f4fd" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Right angle marker at B -->
  <polyline points="260,260 260,240 280,240" fill="none" stroke="#e74c3c" stroke-width="2"/>

  <!-- Angle arc at A (45 degrees) -->
  <path d="M 110,260 A 30,30 0 0,0 101,239" fill="none" stroke="#e67e22" stroke-width="2"/>
  <text x="118" y="248" font-family="Arial" font-size="14" fill="#e67e22" font-weight="bold">45°</text>

  <!-- Labels for vertices -->
  <text x="68" y="278" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">A</text>
  <text x="286" y="278" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">B</text>
  <text x="286" y="95" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">C</text>

  <!-- Side labels -->
  <!-- AB = adjacent -->
  <text x="180" y="280" text-anchor="middle" font-family="Arial" font-size="13" fill="#2980b9">adjacent</text>
  <!-- BC = opposite -->
  <text x="295" y="185" font-family="Arial" font-size="13" fill="#2980b9">opposite</text>
  <!-- AC = hypotenuse -->
  <text x="160" y="170" text-anchor="middle" font-family="Arial" font-size="13" fill="#2980b9" transform="rotate(-38,160,170)">hypotenuse</text>

  <!-- Equal side marks (isosceles right triangle) -->
  <!-- AB tick -->
  <line x1="175" y1="255" x2="175" y2="265" stroke="#2c3e50" stroke-width="2"/>
  <!-- BC tick -->
  <line x1="275" y1="175" x2="285" y2="175" stroke="#2c3e50" stroke-width="2"/>

  <!-- Formula box -->
  <rect x="60" y="295" width="280" height="20" rx="5" fill="#fff9e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="200" y="310" text-anchor="middle" font-family="Arial" font-size="13" fill="#e67e22">cos 45° = adjacent / hypotenuse</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$\cos45° = \tfrac{\sqrt2}{2}$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2024_P2_Q23.html">2024 P2 Q23 ↗</a></div>
