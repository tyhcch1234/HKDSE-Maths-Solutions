  <h1>T10 Q17</h1>
  <div class="card q">A cylinder has a base radius of $3$ cm and a height of $10$ cm. Find its volume, taking $\pi = 3.14$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f0f8ff" rx="10"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e">Cylinder</text>

  <!-- Cylinder body -->
  <rect x="120" y="80" width="160" height="160" fill="#4fc3f7" opacity="0.55" stroke="#0288d1" stroke-width="2"/>

  <!-- Top ellipse -->
  <ellipse cx="200" cy="80" rx="80" ry="25" fill="#81d4fa" opacity="0.7" stroke="#0288d1" stroke-width="2"/>

  <!-- Bottom ellipse (front half visible) -->
  <ellipse cx="200" cy="240" rx="80" ry="25" fill="#4fc3f7" opacity="0.55" stroke="#0288d1" stroke-width="2"/>

  <!-- Radius line on top -->
  <line x1="200" y1="80" x2="280" y2="80" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="200" cy="80" r="3" fill="#d32f2f"/>
  <text x="240" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d32f2f" font-weight="bold">3 cm</text>

  <!-- Height line -->
  <line x1="300" y1="80" x2="300" y2="240" stroke="#2e7d32" stroke-width="2"/>
  <line x1="295" y1="80" x2="305" y2="80" stroke="#2e7d32" stroke-width="2"/>
  <line x1="295" y1="240" x2="305" y2="240" stroke="#2e7d32" stroke-width="2"/>
  <text x="320" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2e7d32" font-weight="bold">10 cm</text>

  <!-- Formula box -->
  <rect x="60" y="278" width="280" height="30" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="200" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">V = pi x r^2 x h = 3.14 x 3^2 x 10</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Volume $= \pi r^2 h = 3.14\times9\times10 = 282.6$ cm³.</div></div>
