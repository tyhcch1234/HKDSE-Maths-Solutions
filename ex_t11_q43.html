  <h1>T11 Q43</h1>
  <div class="card q">How many vertices does a cuboid have?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f3a5f">Cuboid</text>

  <!-- Front face -->
  <polygon points="90,110 250,110 250,240 90,240" fill="#bfe3ff" stroke="#1f6fb2" stroke-width="3"/>

  <!-- Top face -->
  <polygon points="90,110 150,60 310,60 250,110" fill="#d9f2ff" stroke="#1f6fb2" stroke-width="3"/>

  <!-- Right face -->
  <polygon points="250,110 310,60 310,190 250,240" fill="#a9d8f5" stroke="#1f6fb2" stroke-width="3"/>

  <!-- Hidden edges -->
  <line x1="90" y1="240" x2="150" y2="190" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="150" y1="190" x2="310" y2="190" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="150" y1="60" x2="150" y2="190" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Vertices -->
  <g fill="#e63946" stroke="#ffffff" stroke-width="2">
    <circle cx="90" cy="110" r="5"/>
    <circle cx="250" cy="110" r="5"/>
    <circle cx="250" cy="240" r="5"/>
    <circle cx="90" cy="240" r="5"/>
    <circle cx="150" cy="60" r="5"/>
    <circle cx="310" cy="60" r="5"/>
    <circle cx="310" cy="190" r="5"/>
    <circle cx="150" cy="190" r="5"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f3a5f">Count the vertices of the cuboid.</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>A cuboid has 8 vertices.</div></div>
