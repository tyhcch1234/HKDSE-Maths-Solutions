  <h1>T10 Q36</h1>
  <div class="card q">A cube has side length $10$ cm. Find its total surface area.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a3a5c">Cube: side length = 10 cm</text>

  <!-- Front face -->
  <rect x="100" y="110" width="140" height="140" fill="#4da6ff" stroke="#1a3a5c" stroke-width="2.5" opacity="0.85"/>

  <!-- Top face (parallelogram) -->
  <polygon points="100,110 160,60 300,60 240,110" fill="#80c4ff" stroke="#1a3a5c" stroke-width="2.5" opacity="0.85"/>

  <!-- Right face (parallelogram) -->
  <polygon points="240,110 300,60 300,200 240,250" fill="#2e8de0" stroke="#1a3a5c" stroke-width="2.5" opacity="0.85"/>

  <!-- Front face edge labels -->
  <!-- Bottom edge: 10 cm -->
  <line x1="100" y1="258" x2="240" y2="258" stroke="#1a3a5c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="170" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1a3a5c">10 cm</text>

  <!-- Left edge: 10 cm -->
  <line x1="88" y1="110" x2="88" y2="250" stroke="#1a3a5c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="72" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1a3a5c" transform="rotate(-90,72,185)">10 cm</text>

  <!-- Top-right slanted edge label -->
  <text x="275" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a5c">10 cm</text>

  <!-- Right vertical edge label -->
  <text x="312" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a5c">10 cm</text>

  <!-- Small right-angle marker on front face -->
  <polyline points="100,240 110,240 110,250" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>

  <!-- Formula box -->
  <rect x="60" y="290" width="280" height="24" rx="6" fill="#e8f2ff" stroke="#4da6ff" stroke-width="1.5"/>
  <text x="200" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a5c">Total surface area = 6 × (side)²</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>TSA $= 6a^2 = 600$ cm².</div></div>
