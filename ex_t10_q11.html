  <h1>T10 Q11</h1>
  <div class="card q">A sector of a circle has a radius of 4 cm and a central angle of $90^\circ$. Find the area of the sector.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#ffffff"/>
  
  <!-- Sector fill -->
  <path d="M 200 160 L 200 60 A 100 100 0 0 1 300 160 Z" fill="#a8d8ea" stroke="#2c7fb8" stroke-width="2.5"/>
  
  <!-- Radius lines -->
  <line x1="200" y1="160" x2="200" y2="60" stroke="#2c7fb8" stroke-width="2.5"/>
  <line x1="200" y1="160" x2="300" y2="160" stroke="#2c7fb8" stroke-width="2.5"/>
  
  <!-- Right angle marker at center -->
  <rect x="200" y="140" width="20" height="20" fill="none" stroke="#e05a2b" stroke-width="2"/>
  
  <!-- Center dot -->
  <circle cx="200" cy="160" r="3.5" fill="#2c7fb8"/>
  
  <!-- Arc highlight -->
  <path d="M 200 60 A 100 100 0 0 1 300 160" fill="none" stroke="#e05a2b" stroke-width="3"/>
  
  <!-- Radius label (vertical) -->
  <text x="178" y="115" font-family="Arial, sans-serif" font-size="15" fill="#1a5276" font-weight="bold">4 cm</text>
  
  <!-- Radius label (horizontal) -->
  <text x="235" y="182" font-family="Arial, sans-serif" font-size="15" fill="#1a5276" font-weight="bold">4 cm</text>
  
  <!-- Angle label -->
  <text x="218" y="148" font-family="Arial, sans-serif" font-size="14" fill="#e05a2b" font-weight="bold">90°</text>
  
  <!-- Center label -->
  <text x="185" y="178" font-family="Arial, sans-serif" font-size="13" fill="#1a5276">O</text>
  
  <!-- Title -->
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">Sector: r = 4 cm, angle = 90°</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Area $= \tfrac{90}{360}\pi r^2 = \tfrac14\pi\times16 = 4\pi \approx 12.57$ cm².</div></div>
