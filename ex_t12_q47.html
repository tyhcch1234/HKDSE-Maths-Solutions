  <div class="meta">Coordinate Geometry (117) · Sub-Topic: Locus</div>
  <h1>T12 Q47</h1>
  <div class="card q">A point $P(x,y)$ is equidistant from the points $A(-2,3)$ and $B(4,3)$. Describe the locus of $P$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Coordinate axes -->
  <!-- x-axis -->
  <line x1="40" y1="200" x2="370" y2="200" stroke="#333" stroke-width="1.5"/>
  <polygon points="370,200 362,196 362,204" fill="#333"/>
  <!-- y-axis -->
  <line x1="200" y1="290" x2="200" y2="30" stroke="#333" stroke-width="1.5"/>
  <polygon points="200,30 196,38 204,38" fill="#333"/>

  <!-- Axis labels -->
  <text x="375" y="205" font-size="13" fill="#333" font-family="Arial">x</text>
  <text x="205" y="28" font-size="13" fill="#333" font-family="Arial">y</text>
  <text x="188" y="215" font-size="12" fill="#333" font-family="Arial">O</text>

  <!-- Scale: 1 unit = 20px, origin at (200,200) -->
  <!-- A(-2,3) -> (200-40, 200-60) = (160,140) -->
  <!-- B(4,3)  -> (200+80, 200-60) = (280,140) -->
  <!-- Midpoint (1,3) -> (220,140) -->

  <!-- Locus: vertical line x=1, from y=-1 to y=7 roughly -->
  <line x1="220" y1="60" x2="220" y2="280" stroke="#e63946" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="228" y="75" font-size="12" fill="#e63946" font-family="Arial">Locus: x = 1</text>

  <!-- Segment AB -->
  <line x1="160" y1="140" x2="280" y2="140" stroke="#457b9d" stroke-width="2"/>

  <!-- Points A and B -->
  <circle cx="160" cy="140" r="5" fill="#1d3557"/>
  <circle cx="280" cy="140" r="5" fill="#1d3557"/>

  <!-- Labels A and B -->
  <text x="140" y="135" font-size="14" font-weight="bold" fill="#1d3557" font-family="Arial">A(-2,3)</text>
  <text x="288" y="135" font-size="14" font-weight="bold" fill="#1d3557" font-family="Arial">B(4,3)</text>

  <!-- Midpoint marker -->
  <circle cx="220" cy="140" r="4" fill="#e63946"/>
  <text x="225" y="158" font-size="11" fill="#e63946" font-family="Arial">(1,3)</text>

  <!-- Right angle / equal distance ticks -->
  <line x1="190" y1="136" x2="190" y2="144" stroke="#2a9d8f" stroke-width="1.5"/>
  <line x1="250" y1="136" x2="250" y2="144" stroke="#2a9d8f" stroke-width="1.5"/>

  <!-- Tick marks on AB showing equal halves -->
  <line x1="188" y1="135" x2="188" y2="145" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="252" y1="135" x2="252" y2="145" stroke="#2a9d8f" stroke-width="2"/>

  <!-- Small grid dots for reference -->
  <g fill="#ccd6e0">
    <circle cx="160" cy="200" r="1.5"/>
    <circle cx="180" cy="200" r="1.5"/>
    <circle cx="220" cy="200" r="1.5"/>
    <circle cx="240" cy="200" r="1.5"/>
    <circle cx="260" cy="200" r="1.5"/>
    <circle cx="280" cy="200" r="1.5"/>
    <circle cx="200" cy="140" r="1.5"/>
    <circle cx="200" cy="160" r="1.5"/>
    <circle cx="200" cy="180" r="1.5"/>
    <circle cx="200" cy="120" r="1.5"/>
    <circle cx="200" cy="100" r="1.5"/>
  </g>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Vertical line $x=1$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2023_P2_Q24.html">2023 P2 Q24 ↗</a></div>
