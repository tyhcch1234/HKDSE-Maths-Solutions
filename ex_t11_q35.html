  <h1>T11 Q35</h1>
  <div class="card q">Two similar triangles have corresponding side lengths in the ratio $3:1$. Find the ratio of their areas.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a3a6b">Similar Triangles: Side Ratio 3 : 1</text>

  <!-- Large triangle (left) -->
  <polygon points="40,250 200,250 120,90" fill="#7ec8e3" fill-opacity="0.45" stroke="#1a6fa0" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Small triangle (right) -->
  <polygon points="250,250 310,250 280,190" fill="#f4a261" fill-opacity="0.55" stroke="#c05a1a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Side labels large triangle -->
  <text x="120" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a6b">3k</text>
  <text x="68" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a6b" transform="rotate(-56 68 165)">3k</text>
  <text x="172" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1a3a6b" transform="rotate(56 172 165)">3k</text>

  <!-- Side labels small triangle -->
  <text x="280" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c05a1a">1k</text>
  <text x="258" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c05a1a" transform="rotate(-56 258 218)">1k</text>
  <text x="302" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c05a1a" transform="rotate(56 302 218)">1k</text>

  <!-- Ratio annotation -->
  <text x="200" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">Side ratio = 3 : 1  ⇒  Area ratio = ?</text>

  <!-- Small right-angle-like marks omitted for simplicity; keep clean -->
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Area ratio $= 3^2 = 9:1$.</div></div>
