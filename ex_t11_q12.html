  <h1>T11 Q12</h1>
  <div class="card q">Find the sum of the interior angles of a 15-sided polygon.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a3a6b">15-sided polygon</text>
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1a3a6b">Find the sum of interior angles</text>

  <g transform="translate(200,175)">
    <polygon points="0,-105 41,-97 76,-73 100,-40 110,0 100,40 76,73 41,97 0,105 -41,97 -76,73 -100,40 -110,0 -100,-40 -76,-73"
             fill="#d6ecff" stroke="#1f6fd1" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="3" fill="#1f6fd1"/>
    <line x1="0" y1="0" x2="0" y2="-105" stroke="#ff8c42" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="0" y1="0" x2="110" y2="0" stroke="#ff8c42" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="0" y1="0" x2="0" y2="105" stroke="#ff8c42" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="0" y1="0" x2="-110" y2="0" stroke="#ff8c42" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="0" y="-112" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1f6fd1">15 sides</text>
  </g>

  <g transform="translate(200,300)">
    <rect x="-150" y="-22" width="300" height="30" rx="6" fill="#fff3e0" stroke="#ff8c42" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#b35900">Sum = (n - 2) x 180 degrees</text>
  </g>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Sum $= (15-2)\times180° = 2340°$.</div></div>
