  <h1>T10 Q44</h1>
  <div class="card q">Two similar solid spheres have volumes in the ratio $8:27$. Find the ratio of their radii.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f3a5f">Two Similar Solid Spheres</text>

  <!-- Small sphere -->
  <circle cx="120" cy="150" r="55" fill="#7ec8e3" stroke="#1f6f8b" stroke-width="2.5"/>
  <ellipse cx="120" cy="150" rx="55" ry="18" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <ellipse cx="120" cy="150" rx="18" ry="55" fill="none" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="120" y1="150" x2="175" y2="150" stroke="#c0392b" stroke-width="2"/>
  <circle cx="120" cy="150" r="3" fill="#c0392b"/>
  <text x="147" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c0392b">r</text>

  <!-- Large sphere -->
  <circle cx="290" cy="175" r="82" fill="#f6b26b" stroke="#b45f06" stroke-width="2.5"/>
  <ellipse cx="290" cy="175" rx="82" ry="26" fill="none" stroke="#b45f06" stroke-width="1.5" stroke-dasharray="4 3"/>
  <ellipse cx="290" cy="175" rx="26" ry="82" fill="none" stroke="#b45f06" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="290" y1="175" x2="372" y2="175" stroke="#8e2b0e" stroke-width="2"/>
  <circle cx="290" cy="175" r="3" fill="#8e2b0e"/>
  <text x="334" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8e2b0e">R</text>

  <!-- Volume ratio label -->
  <rect x="130" y="268" width="140" height="34" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="200" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f3a5f">Volume ratio = 8 : 27</text>

  <!-- Similar label -->

<h2>Solution</h2>
  <div class="card sol"><div class='step'>Volume ratio $= 8:27$, so linear ratio $= 2:3$.</div><div class='ans'>Heights $= 2:3$.</div></div>
