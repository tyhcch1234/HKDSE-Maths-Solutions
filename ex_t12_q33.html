<div class="wrap">

  <div class="meta">Coordinate Geometry (117) · Sub-Topic: Circle Equation</div>
  <h1>T12 Q33</h1>
  <div class="card q">Write down the equation of the circle with centre $(2,3)$ and radius $4$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Grid lines (light) -->
  <g stroke="#dbe7f3" stroke-width="1">
    <!-- vertical grid -->
    <line x1="40" y1="20" x2="40" y2="300"/>
    <line x1="80" y1="20" x2="80" y2="300"/>
    <line x1="120" y1="20" x2="120" y2="300"/>
    <line x1="160" y1="20" x2="160" y2="300"/>
    <line x1="200" y1="20" x2="200" y2="300"/>
    <line x1="240" y1="20" x2="240" y2="300"/>
    <line x1="280" y1="20" x2="280" y2="300"/>
    <line x1="320" y1="20" x2="320" y2="300"/>
    <line x1="360" y1="20" x2="360" y2="300"/>
    <!-- horizontal grid -->
    <line x1="40" y1="20" x2="360" y2="20"/>
    <line x1="40" y1="60" x2="360" y2="60"/>
    <line x1="40" y1="100" x2="360" y2="100"/>
    <line x1="40" y1="140" x2="360" y2="140"/>
    <line x1="40" y1="180" x2="360" y2="180"/>
    <line x1="40" y1="220" x2="360" y2="220"/>
    <line x1="40" y1="260" x2="360" y2="260"/>
    <line x1="40" y1="300" x2="360" y2="300"/>
  </g>

  <!-- Axes -->
  <g stroke="#334155" stroke-width="2">
    <line x1="40" y1="260" x2="370" y2="260"/>
    <line x1="80" y1="300" x2="80" y2="20"/>
  </g>
  <!-- Arrowheads -->
  <polygon points="370,260 360,255 360,265" fill="#334155"/>
  <polygon points="80,20 75,30 85,30" fill="#334155"/>

  <!-- Axis labels -->
  <text x="372" y="264" font-family="Arial" font-size="14" fill="#334155">x</text>
  <text x="84" y="18" font-family="Arial" font-size="14" fill="#334155">y</text>
  <text x="66" y="275" font-family="Arial" font-size="12" fill="#334155">O</text>

  <!-- Tick marks and labels on x-axis: each unit = 40px, origin at (80,260) -->
  <!-- x=1 at 120, x=2 at 160, x=3 at 200, x=4 at 240, x=5 at 280, x=6 at 320 -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="120" y1="256" x2="120" y2="264"/>
    <line x1="160" y1="256" x2="160" y2="264"/>
    <line x1="200" y1="256" x2="200" y2="264"/>
    <line x1="240" y1="256" x2="240" y2="264"/>
    <line x1="280" y1="256" x2="280" y2="264"/>
    <line x1="320" y1="256" x2="320" y2="264"/>
  </g>
  <g font-family="Arial" font-size="11" fill="#334155" text-anchor="middle">
    <text x="120" y="278">1</text>
    <text x="160" y="278">2</text>
    <text x="200" y="278">3</text>
    <text x="240" y="278">4</text>
    <text x="280" y="278">5</text>
    <text x="320" y="278">6</text>
  </g>

  <!-- Tick marks and labels on y-axis: y=1 at 220, y=2 at 180, y=3 at 140, y=4 at 100, y=5 at 60 -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="76" y1="220" x2="84" y2="220"/>
    <line x1="76" y1="180" x2="84" y2="180"/>
    <line x1="76" y1="140" x2="84" y2="140"/>
    <line x1="76" y1="100" x2="84" y2="100"/>
    <line x1="76" y1="60" x2="84" y2="60"/>
  </g>
  <g font-family="Arial" font-size="11" fill="#334155" text-anchor="end">
    <text x="72" y="224">1</text>
    <text x="72" y="184">2</text>
    <text x="72" y="144">3</text>
    <text x="72" y="104">4</text>
    <text x="72" y="64">5</text>
  </g>

  <!-- Circle: centre (2,3) -> pixel (160,140), radius 4 units = 160px -->
  <circle cx="160" cy="140" r="160" fill="#60a5fa" fill-opacity="0.15" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Centre point -->
  <circle cx="160" cy="140" r="4" fill="#dc2626"/>
  <text x="168" y="134" font-family="Arial" font-size="13" fill="#dc2626" font-weight="bold">(2, 3)</text>

  <!-- Radius line from centre to right edge (2+4=6, 3) -> pixel (320,140) -->
  <line x1="160" y1="140" x2="320" y2="140" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="320" cy="140" r="3" fill="#dc2626"/>
  <text x="235" y="132" font-family="Arial" font-size="13" fill="#dc2626" font-weight="bold">r = 4</text>

  <!-- Title -->
  <text x="200" y="16" font-family="Arial" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Circle: centre (2, 3), radius 4</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$(x-2)^2+(y-3)^2 = 16$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2023_P2_Q24.html">2023 P2 Q24 ↗</a></div>
</div>
