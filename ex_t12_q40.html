  <h1>T12 Q40</h1>
  <div class="card q">Find the equation of the circle with centre $(5, -4)$ and radius $6$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">

  <!-- Axis labels -->

  <!-- Circle: centre (5,-4), radius 6 -->
  <!-- Scale: 40px per unit. Centre at x=200+5*40=400 (off screen) -->
  <!-- Need to adjust scale. Let's use 20px per unit -->
  <!-- Centre (5,-4) -> x=200+5*20=300, y=160+4*20=240 -->
  <!-- Radius 6 -> 120px -->
  <!-- Circle would extend from x=180 to x=420, y=120 to y=360 -->
  <!-- Too big. Let's use 15px per unit -->
  <!-- Centre (5,-4) -> x=200+75=275, y=160+60=220 -->
  <!-- Radius 6 -> 90px -->

  <!-- Title -->

<h2>Solution</h2>
  <div class="card sol"><div class='step'>$(x-5)^2+(y+4)^2 = 36$.</div><div class='ans'>Centre $(5,-4)$, radius $6$.</div></div>
