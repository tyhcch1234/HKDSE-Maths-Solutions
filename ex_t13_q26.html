  <h1>T13 Q26</h1>
  <div class="card q">In triangle \(ABC\), \(AB = 6\), \(AC = 8\), and \(\angle BAC = 60^\circ\). Find the area of triangle \(ABC\).</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#ffffff"/>
  <!-- Triangle vertices: A at left, B upper right, C lower right -->
  <!-- A=(60,240), B=(300,80), C=(300,240) -->
  <polygon points="60,240 300,80 300,240" fill="#d6ecff" stroke="#1f6fb2" stroke-width="3" stroke-linejoin="round"/>
  <!-- Angle arc at A -->
  <path d="M 110,240 A 50,50 0 0 0 85,196" fill="none" stroke="#e05a00" stroke-width="3"/>
  <!-- Right angle marker at C -->
  <polyline points="280,240 280,220 300,220" fill="none" stroke="#888" stroke-width="2"/>
  <!-- Vertex labels -->
  <text x="45" y="255" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f6fb2">A</text>
  <text x="305" y="75" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f6fb2">B</text>
  <text x="305" y="258" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f6fb2">C</text>
  <!-- Side labels -->
  <text x="165" y="150" font-family="Arial, sans-serif" font-size="18" fill="#c0392b" transform="rotate(-33 165 150)">6</text>
  <text x="185" y="265" font-family="Arial, sans-serif" font-size="18" fill="#c0392b">8</text>
  <!-- Angle label -->
  <text x="95" y="215" font-family="Arial, sans-serif" font-size="16" fill="#e05a00">60°</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Area $= \tfrac12(6)(8)\sin60° = 12\sqrt3$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2024_P2_Q23.html">2024 P2 Q23 ↗</a></div>
