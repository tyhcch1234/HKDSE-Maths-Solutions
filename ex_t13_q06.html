  <h1>T13 Q06</h1>
  <div class="card q">Find the value of $\tan 45^\circ$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect width="400" height="320" fill="#f8fbff"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a3a6b">Trigonometric Ratios</text>
  <text x="200" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#333">Find the value of tan 45°</text>

  <!-- Right triangle -->
  <polygon points="120,250 320,250 320,110" fill="#d6ecff" stroke="#1a6fc4" stroke-width="2.5"/>

  <!-- Right angle marker at (320,250) -->
  <polyline points="300,250 300,230 320,230" fill="none" stroke="#1a6fc4" stroke-width="2"/>

  <!-- Angle arc at 45 degrees (at point 120,250) -->
  <path d="M 155,250 A 35,35 0 0 0 145,225" fill="none" stroke="#e05a00" stroke-width="2.5"/>
  <text x="160" y="238" font-family="Arial, sans-serif" font-size="15" fill="#e05a00" font-weight="bold">45°</text>

  <!-- Side labels -->
  <text x="220" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1a3a6b" font-weight="bold">adjacent</text>
  <text x="332" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1a3a6b" font-weight="bold" transform="rotate(90,332,185)">opposite</text>
  <text x="200" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1a3a6b" font-weight="bold" transform="rotate(-35,200,170)">hypotenuse</text>

  <!-- Equal side tick marks (isosceles right triangle) -->
  <line x1="220" y1="245" x2="220" y2="255" stroke="#1a6fc4" stroke-width="2"/>
  <line x1="315" y1="180" x2="325" y2="180" stroke="#1a6fc4" stroke-width="2"/>

  <!-- Formula box -->
  <rect x="90" y="285" width="220" height="28" rx="6" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5"/>
  <text x="200" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a5c00">tan 45° = opposite / adjacent</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$\tan45° = 1$.</div></div>
