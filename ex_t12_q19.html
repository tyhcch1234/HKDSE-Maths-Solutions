  <h1>T12 Q19</h1>
  <div class="card q">Find the slope of the straight line passing through the points $(2, 1)$ and $(4, 5)$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>

  <!-- Grid lines -->
  <g stroke="#dbe7f3" stroke-width="1">
    <line x1="60" y1="40" x2="60" y2="280"/>
    <line x1="110" y1="40" x2="110" y2="280"/>
    <line x1="160" y1="40" x2="160" y2="280"/>
    <line x1="210" y1="40" x2="210" y2="280"/>
    <line x1="260" y1="40" x2="260" y2="280"/>
    <line x1="310" y1="40" x2="310" y2="280"/>
    <line x1="360" y1="40" x2="360" y2="280"/>
    <line x1="60" y1="280" x2="360" y2="280"/>
    <line x1="60" y1="230" x2="360" y2="230"/>
    <line x1="60" y1="180" x2="360" y2="180"/>
    <line x1="60" y1="130" x2="360" y2="130"/>
    <line x1="60" y1="80" x2="360" y2="80"/>
    <line x1="60" y1="40" x2="360" y2="40"/>
  </g>

  <!-- Axes -->
  <line x1="60" y1="280" x2="370" y2="280" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="280" x2="60" y2="30" stroke="#334155" stroke-width="2"/>
  <polygon points="370,280 362,276 362,284" fill="#334155"/>
  <polygon points="60,30 56,38 64,38" fill="#334155"/>
  <text x="375" y="285" font-size="13" fill="#334155" font-family="Arial">x</text>
  <text x="45" y="30" font-size="13" fill="#334155" font-family="Arial">y</text>

  <!-- Axis tick labels -->
  <text x="55" y="295" font-size="11" fill="#475569" font-family="Arial">O</text>
  <text x="155" y="295" font-size="11" fill="#475569" font-family="Arial">2</text>
  <text x="255" y="295" font-size="11" fill="#475569" font-family="Arial">4</text>
  <text x="45" y="235" font-size="11" fill="#475569" font-family="Arial">1</text>
  <text x="45" y="135" font-size="11" fill="#475569" font-family="Arial">5</text>

  <!-- Line through points -->
  <line x1="60" y1="280" x2="310" y2="30" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Point (2,1) -->
  <circle cx="160" cy="230" r="5" fill="#ef4444"/>
  <text x="168" y="248" font-size="12" fill="#ef4444" font-family="Arial">(2, 1)</text>

  <!-- Point (4,5) -->
  <circle cx="260" cy="130" r="5" fill="#ef4444"/>
  <text x="268" y="125" font-size="12" fill="#ef4444" font-family="Arial">(4, 5)</text>

  <!-- Rise and run triangle -->
  <line x1="160" y1="230" x2="260" y2="230" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="260" y1="230" x2="260" y2="130" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="200" y="245" font-size="11" fill="#16a34a" font-family="Arial">run = 2</text>
  <text x="268" y="185" font-size="11" fill="#16a34a" font-family="Arial">rise = 4</text>

  <!-- Slope label -->
  <text x="150" y="60" font-size="13" fill="#2563eb" font-family="Arial">slope = 4 / 2 = 2</text>

<h2>Solution</h2>
  <div class="card sol"><div class='step'>Slope $= \tfrac{5-1}{4-2} = 2$.</div><div class='step'>$y-1 = 2(x-2) \Rightarrow y = 2x-3$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2023_P2_Q24.html">2023 P2 Q24 ↗</a></div>
</div>
