  <h1>T10 Q19</h1>
  <div class="card q">Find the volume of a sphere with radius $6$ cm, taking $\pi = 3.14$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8ecbff"/>
      <stop offset="55%" stop-color="#4a9fe0"/>
      <stop offset="100%" stop-color="#1f5f9e"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="320" fill="#f7fbff"/>

  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f3b57">Volume of a Sphere</text>

  <!-- Sphere -->
  <circle cx="200" cy="165" r="100" fill="url(#sphereGrad)" stroke="#14456f" stroke-width="2"/>

  <!-- Equator ellipse (3D effect) -->
  <ellipse cx="200" cy="165" rx="100" ry="28" fill="none" stroke="#14456f" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- Radius line -->
  <line x1="200" y1="165" x2="300" y2="165" stroke="#d62828" stroke-width="3"/>
  <circle cx="200" cy="165" r="4" fill="#d62828"/>

  <!-- Radius label -->
  <text x="250" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d62828">6 cm</text>

  <!-- Formula box -->
  <rect x="90" y="278" width="220" height="32" rx="8" fill="#e8f4ff" stroke="#4a9fe0" stroke-width="1.5"/>
  <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f3b57">V = (4/3) x pi x r^3</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Volume $= \tfrac43\pi r^3 = \tfrac43\times3.14\times216 = 904.32$ cm³.</div></div>
