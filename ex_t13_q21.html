  <div class="meta">Trigonometry (59) · Sub-Topic: Sine/Cosine Law</div>
  <h1>T13 Q21</h1>
  <div class="card q">In triangle $ABC$, $b=6$, $c=8$ and $\angle A=60^\circ$. Find $a^2$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="#f8fbff"/>
  
  <!-- Triangle ABC -->
  <!-- A at (70, 250), B at (330, 250), C at (170, 70) -->
  <polygon points="70,250 330,250 170,70" fill="#d4eaff" stroke="#1a6fc4" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Angle arc at A -->
  <path d="M 110,250 A 40,40 0 0,0 90,218" fill="none" stroke="#e05a00" stroke-width="2.5"/>
  <text x="108" y="238" font-family="Arial, sans-serif" font-size="15" fill="#e05a00" font-weight="bold">60°</text>
  
  <!-- Side labels -->
  <!-- b = AC (left side) -->
  <text x="95" y="155" font-family="Arial, sans-serif" font-size="16" fill="#1a6fc4" font-weight="bold" transform="rotate(-56, 95, 155)">b = 6</text>
  
  <!-- c = AB (bottom side) -->
  <text x="185" y="275" font-family="Arial, sans-serif" font-size="16" fill="#1a6fc4" font-weight="bold">c = 8</text>
  
  <!-- a = BC (right side) -->
  <text x="265" y="155" font-family="Arial, sans-serif" font-size="16" fill="#1a6fc4" font-weight="bold" transform="rotate(56, 265, 155)">a = ?</text>
  
  <!-- Vertex labels -->
  <circle cx="70" cy="250" r="4" fill="#1a6fc4"/>
  <text x="48" y="268" font-family="Arial, sans-serif" font-size="18" fill="#222" font-weight="bold">A</text>
  
  <circle cx="330" cy="250" r="4" fill="#1a6fc4"/>
  <text x="338" y="268" font-family="Arial, sans-serif" font-size="18" fill="#222" font-weight="bold">B</text>
  
  <circle cx="170" cy="70" r="4" fill="#1a6fc4"/>
  <text x="162" y="58" font-family="Arial, sans-serif" font-size="18" fill="#222" font-weight="bold">C</text>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Triangle ABC</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$a^2 = 6^2+8^2-2(6)(8)\cos60° = 52$.</div><div class='step'>$a = 2\sqrt{13}$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2015_P2_Q18.html">2015 P2 Q18 ↗</a></div>
