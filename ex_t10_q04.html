  <h1>T10 Q04</h1>
  <div class="card q">Find the area of a rectangle with length $9$ cm and width $4$ cm.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect x="0" y="0" width="400" height="320" fill="#f8fafc"/>
  <rect x="70" y="90" width="260" height="120" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" rx="2"/>
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="bold">9 cm</text>
  <text x="50" y="155" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="bold" transform="rotate(-90 50 155)">4 cm</text>
  <line x1="70" y1="90" x2="330" y2="90" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="70" y1="90" x2="70" y2="210" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="70" y1="210" x2="330" y2="210" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="330" y1="90" x2="330" y2="210" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 70 100 L 80 100 L 80 90" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 320 90 L 320 100 L 330 100" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 70 200 L 80 200 L 80 210" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 320 210 L 320 200 L 330 200" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">Rectangle</text>
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Area = length × width</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>Area $= 9 \times 4 = 36$ cm².</div></div>
