  <a class="back" href="DSE_Maths_Exercise.html">← Back to Exercises</a>
  <div class="meta">Coordinate Geometry (117) · Sub-Topic: Equation of Straight Line</div>
  <h1>T12 Q26</h1>
  <div class="card q">Find the $x$-coordinate of the intersection point of the lines $y=2x+1$ and $y=-x+4$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#ffffff"/>
  <!-- axes -->
  <line x1="50" y1="270" x2="370" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="30" x2="70" y2="290" stroke="#333" stroke-width="2"/>
  <polygon points="370,270 360,265 360,275" fill="#333"/>
  <polygon points="70,30 65,40 75,40" fill="#333"/>
  <text x="375" y="275" font-size="14" fill="#333">x</text>
  <text x="60" y="28" font-size="14" fill="#333">y</text>
  <text x="55" y="285" font-size="12" fill="#333">O</text>

  <!-- line y = 2x + 1 : passes (0,1) and (1,3) -->
  <!-- scale: 1 unit = 50px, origin at (70,270) -->
  <!-- (0,1) -> (70,220); (1,3) -> (120,120); extend to x=-0.5 -> (45,245) and x=2 -> (170,70) -->
  <line x1="45" y1="245" x2="190" y2="70" stroke="#e63946" stroke-width="3"/>
  <text x="195" y="70" font-size="14" fill="#e63946">y = 2x + 1</text>

  <!-- line y = -x + 4 : passes (0,4) and (4,0) -->
  <!-- (0,4) -> (70,70); (4,0) -> (270,270); extend to x=-0.5 -> (45,95) and x=4.5 -> (295,295) -->
  <line x1="45" y1="95" x2="295" y2="295" stroke="#1d70b8" stroke-width="3"/>
  <text x="300" y="300" font-size="14" fill="#1d70b8">y = -x + 4</text>

  <!-- intersection at x=1, y=3 -> (120,120) -->
  <circle cx="120" cy="120" r="5" fill="#2a9d8f"/>
  <line x1="120" y1="120" x2="120" y2="270" stroke="#2a9d8f" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="112" y="290" font-size="13" fill="#2a9d8f">x = 1</text>
  <text x="128" y="112" font-size="13" fill="#2a9d8f">(1, 3)</text>

  <!-- tick marks -->
  <line x1="120" y1="270" x2="120" y2="276" stroke="#333" stroke-width="1.5"/>
  <text x="116" y="288" font-size="11" fill="#333">1</text>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$2x+1 = -x+4 \Rightarrow 3x = 3$.</div><div class='step'>$x=1$, $y=3$.</div></div>
  <div class="ref">Reference DSE Question: <a class="ref-link" href="2019_P2_Q25.html">2019 P2 Q25 ↗</a></div>
</div>
