  <div class="card q">How many faces does a cone have?</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#f0f8ff"/>

  <path d="M 90 250 L 200 60 L 310 250" fill="#4cc9f0" stroke="#0077b6" stroke-width="2.5" opacity="0.85"/>
  <ellipse cx="200" cy="250" rx="110" ry="35" fill="none" stroke="#e07a00" stroke-width="2.5"/>
