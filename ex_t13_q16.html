  <h1>T13 Q16</h1>
  <div class="card q">In triangle $ABC$, $a=7$, $b=8$ and $c=5$. Find $\cos A$.</div>
  <div class="card" style="margin-top:.6rem;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <rect width="400" height="320" fill="#ffffff"/>
  <!-- Triangle vertices: A top, B bottom-left, C bottom-right -->
  <!-- Side a = BC = 7 (opposite A), b = AC = 8 (opposite B), c = AB = 5 (opposite C) -->
  <!-- Place B at (80,250), C at (300,250) so BC=220px ~ 7 units -->
  <!-- A determined by AB=5, AC=8 -->
  <polygon points="80,250 300,250 152,60" fill="#e8f4ff" stroke="#1a6fc4" stroke-width="3" stroke-linejoin="round"/>
  <!-- Vertex labels -->
  <text x="145" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#c0392b">A</text>
  <text x="62" y="272" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#c0392b">B</text>
  <text x="305" y="272" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#c0392b">C</text>
  <!-- Side labels -->
  <!-- a = BC = 7 -->
  <text x="182" y="272" font-family="Arial, sans-serif" font-size="17" fill="#2c3e50">a = 7</text>
  <!-- b = AC = 8 -->
  <text x="238" y="145" font-family="Arial, sans-serif" font-size="17" fill="#2c3e50">b = 8</text>
  <!-- c = AB = 5 -->
  <text x="92" y="145" font-family="Arial, sans-serif" font-size="17" fill="#2c3e50">c = 5</text>
  <!-- Angle A marker -->
  <path d="M 140,80 A 22,22 0 0 1 165,80" fill="none" stroke="#e67e22" stroke-width="2.5"/>
  <text x="138" y="100" font-family="Arial, sans-serif" font-size="16" fill="#e67e22">A</text>
  <!-- Highlight angle A arc more visibly -->
  <path d="M 132,78 Q 152,95 172,78" fill="none" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="4,3"/>
</svg></div>
<h2>Solution</h2>
  <div class="card sol"><div class='step'>$\cos A = \tfrac{b^2+c^2-a^2}{2bc} = \tfrac{64+25-49}{80} = \tfrac12$.</div></div>

</div>
